<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPD - Rincian Pengajuan Bulanan | APBD TRACKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        html {
            font-size: 13px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        textarea.redaksi-text {
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.6;
            tab-size: 4;
        }

        textarea.redaksi-text:focus {
            outline: none;
        }

        .scroll-smooth-y {
            scroll-behavior: smooth;
        }

        .sipd-table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            height: calc(100vh - 200px);
            min-height: 360px;
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 116, 139, 0.75) rgba(226, 232, 240, 0.9);
        }

        .sipd-table-scroll::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .sipd-table-scroll::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.9);
        }

        .sipd-table-scroll::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.8);
            border-radius: 9999px;
            border: 2px solid rgba(226, 232, 240, 0.9);
        }

        #sipd-main-table thead,
        #sipd-main-table thead tr {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: #0f172a !important;
        }

        #sipd-main-table tfoot,
        #sipd-main-table tfoot tr {
            position: sticky;
            bottom: 0;
            z-index: 40;
            background-color: #0f172a !important;
        }

        #sipd-main-table th {
            position: sticky;
            top: 0;
            background-color: #0f172a !important;
            color: #ffffff !important;
        }

        #sipd-main-table thead th,
        #sipd-table-head th {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-color: #334155 !important;
            box-shadow: inset 0 -1px 0 rgba(148, 163, 184, 0.35);
        }

        #sipd-main-table thead th *,
        #sipd-table-head th * {
            color: #ffffff !important;
        }

        #sipd-main-table thead th button>span,
        #sipd-main-table thead th button>div,
        #sipd-table-head th button>span,
        #sipd-table-head th button>div {
            display: block;
            line-height: 1.2;
            text-align: center;
        }

        #sipd-main-table tbody td {
            font-size: 9px;
        }

        /* Color overrides matching apbd.html */
        header.bg-slate-300 {
            background-color: #d1d5db !important;
            color: #0f172a !important;
        }

        header.bg-slate-300 .text-slate-950,
        header.bg-slate-300 .text-emerald-700,
        header.bg-slate-300 #global-sisa {
            color: #111827 !important;
        }

        .bg-blue-400 {
            background-color: #93c5fd !important;
            color: #111827 !important;
        }

        .bg-emerald-700 {
            background-color: #047857 !important;
            color: #111827 !important;
        }

        .bg-emerald-600 {
            background-color: #16a34a !important;
            color: #111827 !important;
        }

        .bg-emerald-500 {
            background-color: #22c55e !important;
            color: #111827 !important;
        }

        .bg-emerald-400 {
            background-color: #86efac !important;
            color: #111827 !important;
        }

        .bg-emerald-300 {
            background-color: #bbf7d0 !important;
            color: #111827 !important;
        }

        .bg-lime-300 {
            background-color: #bef264 !important;
            color: #172554 !important;
        }

        .bg-orange-300 {
            background-color: #fdba74 !important;
            color: #111827 !important;
        }

        .bg-slate-300 {
            background-color: #d1d5db !important;
            color: #111827 !important;
        }

        .bg-slate-800 {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }

        #sipd-table-head th,
        #sipd-table-head .bg-slate-300 {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 font-sans pb-10">

    <header class="bg-slate-300 sticky top-0 z-[100] px-4 py-1 text-slate-950 shadow-2xl border-b-2 border-amber-300">
        <div class="container w-full px-2 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <a href="apbd.html"
                    class="bg-slate-200 hover:bg-slate-100 p-1.5 rounded-lg border border-slate-300 transition-all text-slate-700"
                    title="Kembali ke APBD Tracker">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                </a>
                <div class="bg-cyan-500 p-1 rounded-xl -rotate-6 shadow-xl"><i data-lucide="clipboard-list"
                        class="w-3.5 h-3.5 text-slate-950"></i></div>
                <div>
                    <h1 class="text-base font-black italic tracking-tighter uppercase leading-none text-slate-900">SIPD
                        <span class="text-cyan-600 font-black italic text-[16px] ml-0.5">PENATAUSAHAAN KEUANGAN</span>
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-700 mt-0.5">Pengajuan dan
                        Realisasi Bulanan</p>
                </div>
            </div>

            <div class="hidden lg:flex gap-3 items-center">
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-white border-2 border-cyan-300 shadow-sm">
                    <i id="sipd-lock-icon" data-lucide="lock-open" class="w-3 h-3 text-cyan-700"></i>
                    <span class="text-[7px] font-black uppercase tracking-widest text-cyan-900">
                        Pagu: <span id="sipd-active-mode-label">Perubahan</span>
                    </span>
                </div>
                <div class="h-4 w-[1px] bg-slate-300"></div>
                <div class="text-right">
                    <div class="text-[5px] text-slate-600 uppercase font-black tracking-widest">Sisa Kas</div>
                    <div id="global-sisa"
                        class="text-xs font-mono font-black text-emerald-700 leading-none tracking-tighter">0</div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-2">
        <!-- Action Bar -->
        <div class="mb-2 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 flex-wrap">

                <!-- Kode Panti, ComboBox Bulan & Button Pengajuan -->
                <div class="flex items-center gap-1.5 flex-wrap">
                    <!-- Textarea Kode Panti + Checkbox Simpan Tetap -->
                    <div
                        class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-md px-1.5 py-1 shadow-sm">
                        <i data-lucide="building-2" class="w-2.5 h-2.5 text-slate-600"></i>
                        <label class="text-[6px] font-black uppercase tracking-widest text-slate-500">Kode
                            Panti:</label>
                        <input type="text" id="sipd-kode-panti" placeholder="Isi Kode Panti..."
                            class="rounded text-[7px] font-black outline-none border border-slate-200 px-1.5 py-0.5 w-[110px] bg-white text-slate-900 leading-tight"
                            oninput="sipdOnKodePantiChange()" />
                        <label
                            class="flex items-center gap-1 cursor-pointer text-[6.5px] font-black uppercase text-slate-600 select-none ml-1"
                            title="Simpan tetap Kode Panti ini agar tidak hilang saat reload">
                            <input type="checkbox" id="sipd-simpan-tetap-panti" onchange="sipdOnSimpanTetapChange()"
                                class="rounded text-cyan-600 focus:ring-cyan-500 h-3 w-3 cursor-pointer">
                            <span>Simpan Tetap</span>
                        </label>
                    </div>

                    <!-- ComboBox Bulan -->
                    <div
                        class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-md px-1.5 py-1 shadow-sm">
                        <i data-lucide="calendar" class="w-2.5 h-2.5 text-slate-600"></i>
                        <label class="text-[6px] font-black uppercase tracking-widest text-slate-500">Bulan:</label>
                        <select id="sipd-bulan-redaksi" onchange="sipdOnBulanRedaksiChange(this.value)"
                            style="background-color:#ffffff !important; color:#000000 !important;"
                            class="rounded text-[7px] font-black outline-none appearance-none cursor-pointer px-1.5 py-0.5 w-[110px]">
                            <option value="1" style="background:#ffffff; color:#000000;">Januari</option>
                            <option value="2" style="background:#ffffff; color:#000000;">Februari</option>
                            <option value="3" style="background:#ffffff; color:#000000;">Maret</option>
                            <option value="4" style="background:#ffffff; color:#000000;">April</option>
                            <option value="5" style="background:#ffffff; color:#000000;">Mei</option>
                            <option value="6" style="background:#ffffff; color:#000000;">Juni</option>
                            <option value="7" style="background:#ffffff; color:#000000;">Juli</option>
                            <option value="8" style="background:#ffffff; color:#000000;">Agustus</option>
                            <option value="9" style="background:#ffffff; color:#000000;">September</option>
                            <option value="10" style="background:#ffffff; color:#000000;">Oktober</option>
                            <option value="11" style="background:#ffffff; color:#000000;">November</option>
                            <option value="12" style="background:#ffffff; color:#000000;">Desember</option>
                        </select>
                        <button onclick="sipdResetBulan()" id="sipd-reset-bulan-btn"
                            title="Tampilkan SEMUA Bulan (reset filter)"
                            class="ml-0.5 bg-white hover:bg-slate-200 p-0.5 rounded text-slate-500 hover:text-slate-700 transition">
                            <i data-lucide="x" class="w-2.5 h-2.5"></i>
                        </button>
                    </div>

                    <!-- Button "Pengajuan" (Filter Hanya Sub-Kegiatan yang Diajukan) -->
                    <button id="sipd-btn-only-pengajuan" onclick="sipdToggleOnlyPengajuan()"
                        title="Klik untuk menampilkan Sub-Kegiatan yang diajukan saja pada bulan ini"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md font-black uppercase text-[8px] flex items-center gap-1.5 transition-all shadow-md">
                        <i data-lucide="file-check" class="w-3 h-3"></i> Pengajuan
                    </button>
                    <!-- Container Badge Reset Urutan (jika sorting aktif) -->
                    <div id="sipd-sort-active-container" class="hidden"></div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="sipd-btn-detail-toggle" onclick="sipdToggleExpandAll()"
                    class="bg-amber-500 text-white px-3 py-1.5 rounded-lg font-black uppercase text-[8px] flex items-center gap-1.5 hover:bg-amber-600 transition-all shadow-sm">
                    <i data-lucide="unfold-vertical" class="w-3 h-3"></i> Detail
                </button>
                <button onclick="sipdExportExcel()"
                    class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg font-black uppercase text-[8px] flex items-center gap-1.5 hover:bg-emerald-600 hover:text-white transition-all shadow-sm">
                    <i data-lucide="file-output" class="w-3 h-3"></i> Excel
                </button>

                <!-- Column Checklist Dropdown -->
                <div class="relative inline-block text-left" id="sipd-col-toggle-wrapper">
                    <button onclick="sipdToggleColDropdown()" id="sipd-btn-col-toggle"
                        class="bg-cyan-700 text-white px-3 py-1.5 rounded-lg font-black uppercase text-[8px] flex items-center gap-1.5 hover:bg-cyan-800 transition-all shadow-sm">
                        <i data-lucide="columns" class="w-3 h-3"></i> Kolom Tabel
                    </button>
                    <div id="sipd-col-dropdown"
                        class="hidden absolute right-0 mt-1 w-64 bg-white rounded-xl shadow-2xl border border-slate-200 z-[150] p-3 text-slate-800">
                        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100">
                            <span class="text-[9px] font-black uppercase text-slate-700 tracking-wider">Checklist
                                Kolom</span>
                            <div class="flex gap-1">
                                <button onclick="sipdSetAllCols(true)"
                                    class="text-[7px] font-black uppercase text-blue-600 hover:text-blue-800 bg-blue-50 px-1.5 py-0.5 rounded">Semua</button>
                                <button onclick="sipdSetAllCols(false)"
                                    class="text-[7px] font-black uppercase text-rose-600 hover:text-rose-800 bg-rose-50 px-1.5 py-0.5 rounded">Sembunyikan</button>
                            </div>
                        </div>
                        <div id="sipd-col-checkbox-container" class="space-y-1 max-h-60 overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Section SIPD -->
        <div class="mb-2 bg-white p-2 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <!-- Row 1: Search -->
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search"
                        class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 w-3 h-3"></i>
                    <input id="sipd-search" oninput="sipdDebounceRender()"
                        placeholder="Cari Kode, Uraian Program/Rekening..."
                        class="w-full pl-8 pr-3 py-1.5 bg-slate-50 rounded-lg border border-slate-100 font-bold text-[9px] outline-none focus:ring-2 ring-cyan-500/5 transition-all" />
                </div>

                <button id="sipd-reset-btn" onclick="sipdResetFilter()"
                    class="hidden bg-rose-600 text-white px-2 py-1 rounded-md font-black uppercase text-[7px] flex items-center gap-1 shadow-lg hover:bg-rose-700 transition-all animate-pulse">
                    <i data-lucide="refresh-ccw" class="w-2.5 h-2.5"></i> RESET
                </button>
            </div>

            <!-- Row 2: Hierarki Filters (Program - Kegiatan - Sub-Kegiatan - Rekening) -->
            <div class="pt-2 border-t border-slate-100">
                <div class="grid grid-cols-4 gap-1.5 items-end">
                    <div class="space-y-0.5">
                        <label class="text-[6px] font-black text-slate-400 uppercase ml-1">Program</label>
                        <select id="sipd-program" onchange="sipdOnHierChange('program')"
                            class="w-full bg-white border border-slate-200 rounded-md px-1.5 py-1 text-[8px] font-bold outline-none focus:ring-1 ring-blue-500/20">
                            <option value="all">SEMUA PROGRAM</option>
                        </select>
                    </div>
                    <div class="space-y-0.5">
                        <label class="text-[6px] font-black text-slate-400 uppercase ml-1">Kegiatan</label>
                        <select id="sipd-kegiatan" onchange="sipdOnHierChange('kegiatan')"
                            class="w-full bg-white border border-slate-200 rounded-md px-1.5 py-1 text-[8px] font-bold outline-none focus:ring-1 ring-indigo-500/20 disabled:opacity-50 disabled:bg-slate-100 cursor-not-allowed">
                            <option value="all">SEMUA KEGIATAN</option>
                        </select>
                    </div>
                    <div class="space-y-0.5">
                        <label class="text-[6px] font-black text-slate-400 uppercase ml-1">Sub-Kegiatan</label>
                        <select id="sipd-subkeg" onchange="sipdOnHierChange('sub_kegiatan')"
                            class="w-full bg-white border border-slate-200 rounded-md px-1.5 py-1 text-[8px] font-bold outline-none focus:ring-1 ring-emerald-500/20 disabled:opacity-50 disabled:bg-slate-100 cursor-not-allowed">
                            <option value="all">SEMUA SUB-KEGIATAN</option>
                        </select>
                    </div>
                    <div class="space-y-0.5">
                        <label class="text-[6px] font-black text-slate-400 uppercase ml-1">Rekening</label>
                        <select id="sipd-rekening" onchange="sipdOnHierChange('rekening')"
                            class="w-full bg-white border border-slate-200 rounded-md px-1.5 py-1 text-[8px] font-bold outline-none focus:ring-1 ring-orange-500/20 disabled:opacity-50 disabled:bg-slate-100 cursor-not-allowed">
                            <option value="all">SEMUA REKENING</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- SIPD Table -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex-1">
            <div class="sipd-table-scroll">
                <table id="sipd-main-table" class="w-full text-left border-collapse"
                    style="width: max-content; min-width: 100%; table-layout: fixed;">
                    <thead id="sipd-table-head"></thead>
                    <tbody id="sipd-table-body" class="divide-y divide-slate-200"></tbody>
                    <tfoot id="sipd-table-foot" class="sticky bottom-0 z-[40]"></tfoot>
                </table>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="sipd-redaksi-modal"
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4"></div>

    <!-- Notification Toast -->
    <div id="notif"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[500] px-8 py-4 bg-slate-900 text-white rounded-full shadow-2xl font-black text-[10px] uppercase tracking-[0.2em] flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
        <i id="notif-icon" data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
        <span id="notif-msg"></span>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://yewkffbatvrbtfliikia.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_gh_LzjznODmbTtMBzt5aaA_sFTDMykg";
        let supa = null;
        try {
            if (typeof supabase !== 'undefined') {
                supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("[SIPD] Supabase early init failed:", e);
        }
        const appId = 'SIPD_PAGU_ADVANCED_v2';

        const PIN_OTORITAS = "888";
        const BULAN_LIST = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        const BULAN_LIST_FULL = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        const SUMBER_DANA = [
            { id: 'DAU', label: 'DAU', color: 'bg-amber-400 text-amber-950', icon: 'wallet' },
            { id: 'DAK', label: 'DAK', color: 'bg-cyan-500 text-white', icon: 'database' },
            { id: 'PAD', label: 'PAD', color: 'bg-emerald-500 text-white', icon: 'bar-chart-3' },
            { id: 'LAINNYA', label: 'Lainnya', color: 'bg-slate-400 text-slate-900', icon: 'tag' }
        ];

        const METODE_BELANJA = [
            { id: 'EPURCHASING', label: 'E-PURCH', color: 'bg-blue-600 text-white', icon: 'shopping-cart' },
            { id: 'SWAKELOLA', label: 'SWAKELOLA', color: 'bg-purple-600 text-white', icon: 'users' },
            { id: 'LANGSUNG', label: 'LANGSUNG', color: 'bg-rose-600 text-white', icon: 'hand-coins' },
            { id: 'DIKECUALIKAN', label: 'DIKECUALIKAN', color: 'bg-orange-500 text-white', icon: 'shield-check' },
            { id: 'TIDAK_ADA', label: 'N/A', color: 'bg-slate-200 text-slate-500', icon: 'x' }
        ];

        const METODE_BELANJA_2 = [
            { id: 'PENYEDIA_SWAKELOLA', label: 'Penyedia Dalam Swakelola', color: 'bg-violet-500 text-white', icon: 'user-cog' },
            { id: 'TIDAK_ADA', label: 'N/A', color: 'bg-slate-200 text-slate-500', icon: 'x' }
        ];

        const PELAKSANA = [
            { id: 'TU', label: 'Tata Usaha', color: 'bg-lime-300 text-black', icon: 'building' },
            { id: 'PENYANTUNAN', label: 'Penyantunan', color: 'bg-indigo-600 text-black', icon: 'heart' },
            { id: 'BIMRESOS', label: 'Bimresos', color: 'bg-teal-600 text-black', icon: 'users-round' },
            { id: 'LAINNYA', label: 'Lainnya', color: 'bg-slate-400 text-black', icon: 'user' }
        ];

        const LEVEL_STYLES = {
            program: { bg: 'bg-blue-400', text: 'text-slate-950', border: 'border-sky-300', accent: 'bg-blue-200', label: 'Program', icon: 'layers' },
            kegiatan: { bg: 'bg-emerald-600', text: 'text-slate-950', border: 'border-emerald-300', accent: 'bg-emerald-200', label: 'Kegiatan', icon: 'database' },
            sub_kegiatan: { bg: 'bg-emerald-400', text: 'text-slate-950', border: 'border-emerald-200', accent: 'bg-emerald-100', label: 'Sub-Kegiatan', icon: 'tag' },
            rekening: { bg: 'bg-orange-300', text: 'text-slate-950', border: 'border-orange-200', accent: 'bg-orange-200', label: 'Rekening', icon: 'receipt' }
        };

        // --- STATE ---
        const DEFAULT_VISIBLE_COLUMNS = {
            kode: true, uraian: true, pagu: true, realisasi: true, pajak: true, sisa: true,
            realisasi_bulanan: true, pajak_bulanan: true, sisa_saldo: true,
            jan: true, feb: true, mar: true, apr: true, mei: true, jun: true,
            jul: true, agu: true, sep: true, okt: true, nov: true, des: true,
            redaksi_pengajuan: true, redaksi_belanja: true, redaksi_sts: true
        };

        function sipdNormalizeVisibleColumns(raw) {
            const base = raw && typeof raw === 'object' ? { ...raw } : {};
            return { ...DEFAULT_VISIBLE_COLUMNS, ...base };
        }

        let state = {
            viewMode: localStorage.getItem(`${appId}_viewMode`) || 'perubahan',
            isModeLocked: localStorage.getItem(`${appId}_isModeLocked`) === 'true',
            data: { pagu: [], realisasi: [], backups: [], redaksi: {} },
            sipd: {
                expanded: {},
                allExpanded: false,
                filterHier: { program: 'all', kegiatan: 'all', sub_kegiatan: 'all', rekening: 'all' },
                filterSearch: '',
                _debounceTimer: null,
                _saveTimer: null,
                bulanRedaksi: null,
                redaksi: {},
                sortKey: null,
                sortDir: 'none',
                visibleColumns: sipdNormalizeVisibleColumns((function () {
                    try {
                        const saved = localStorage.getItem(`${appId}_visibleColumns`);
                        return saved ? JSON.parse(saved) : null;
                    } catch (e) { return null; }
                })())
            }
        };

        // --- UTILS ---
        const formatRupiah = (num) => {
            if (num === undefined || num === null || num === '') return '';
            const val = typeof num === 'string' ? parseInt(num.replace(/[^0-9]/g, '')) : num;
            if (isNaN(val)) return '0';
            return new Intl.NumberFormat('id-ID').format(val);
        };

        const parseRupiah = (str) => {
            if (!str) return 0;
            return parseInt(str.toString().replace(/[^0-9]/g, '')) || 0;
        };

        function terbilang(angka) {
            const bil = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            let n = parseInt(angka);
            if (n < 12) return bil[n];
            if (n < 20) return bil[n - 10] + " Belas";
            if (n < 100) return bil[Math.floor(n / 10)] + " Puluh " + bil[n % 10];
            if (n < 200) return "Seratus " + terbilang(n - 100);
            if (n < 1000) return bil[Math.floor(n / 100)] + " Ratus " + terbilang(n % 100);
            if (n < 2000) return "Seribu " + terbilang(n - 1000);
            if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + terbilang(n % 1000);
            if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + terbilang(n % 1000000);
            if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " Miliar " + terbilang(n % 1000000000);
            return terbilang(Math.floor(n / 1000000000000)) + " Triliun " + terbilang(n % 1000000000000);
        }

        function showNotif(msg, type = 'success') {
            const el = document.getElementById('notif');
            const msgEl = document.getElementById('notif-msg');
            const iconEl = document.getElementById('notif-icon');
            msgEl.innerText = msg;
            if (type === 'success') iconEl.className = 'w-4 h-4 text-emerald-400';
            else if (type === 'error') iconEl.className = 'w-4 h-4 text-rose-400';
            else if (type === 'warning') iconEl.className = 'w-4 h-4 text-amber-400';
            else iconEl.className = 'w-4 h-4 text-cyan-400';
            iconEl.setAttribute('data-lucide', type === 'success' ? 'check-circle-2' : type === 'error' ? 'x-circle' : type === 'warning' ? 'alert-triangle' : 'info');
            el.style.opacity = '1';
            el.style.transform = 'translate(-50%, 0)';
            lucide.createIcons();
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, 10px)';
            }, 3000);
        }

        // --- CORE DATABASE FUNCTIONS ---
        async function init() {
            try {
                console.log("[SIPD] Initializing database connection...");
                let retries = 0;
                while (typeof supabase === 'undefined' && retries < 10) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    retries++;
                }
                if (typeof supabase === 'undefined') throw new Error("Library Supabase tidak terdeteksi.");
                if (!supa) supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data, error } = await supa
                    .from('sipd_main_document')
                    .select('pagu,realisasi,backups,redaksi')
                    .eq('app_id', appId)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    state.data = {
                        pagu: data.pagu || [],
                        realisasi: data.realisasi || [],
                        backups: data.backups || [],
                        redaksi: data.redaksi || {}
                    };
                    state.sipd.redaksi = state.data.redaksi || {};
                } else {
                    await saveToSupabase({ pagu: [], realisasi: [], backups: [], redaksi: {} });
                }
                renderSIPD();
            } catch (err) {
                console.error("[SIPD] Initialization failed:", err);
                showNotif(err.message || "Gagal memuat data", "error");
                renderSIPD();
            }
        }

        async function saveToSupabase(newData) {
            try {
                if (!supa) throw new Error("Koneksi database belum terinisialisasi.");
                state.data = newData;
                state.sipd.redaksi = newData.redaksi || state.sipd.redaksi;

                // Modul SIPD hanya menulis kolom `pagu` (berisi struktur + data pengajuan)
                // dan `redaksi`. Kolom `realisasi` & `backups` sengaja TIDAK dikirim
                // agar tidak menimpa data yang dikelola apbd.html / bend23.html.
                const { error } = await supa
                    .from('sipd_main_document')
                    .upsert({
                        app_id: appId,
                        pagu: newData.pagu,
                        redaksi: newData.redaksi || {},
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'app_id' });

                if (error) throw error;
            } catch (err) {
                console.error("Save Error:", err);
                showNotif("Gagal menyimpan: " + (err.message || ""), "error");
            }
        }

        function sipdSaveDebounce() {
            if (state.sipd._saveTimer) clearTimeout(state.sipd._saveTimer);
            state.sipd._saveTimer = setTimeout(() => {
                saveToSupabase({
                    pagu: state.data.pagu,
                    realisasi: state.data.realisasi,
                    backups: state.data.backups,
                    redaksi: state.sipd.redaksi
                }).catch(() => { });
            }, 800);
        }

        // --- CALCULATION LOGIC ---
        function getAggregatedData(item) {
            let paguMurni = item.type === 'rekening' ? parseRupiah(item.paguMurni || item.pagu || 0) : 0;
            let paguEfisiensi = item.type === 'rekening' ? parseRupiah(item.paguEfisiensi || 0) : 0;
            let paguPerubahan = item.type === 'rekening' ? parseRupiah(item.paguPerubahan || item.pagu || 0) : 0;
            let belumSP2D = parseRupiah(item.belumSP2D || 0);

            const transactions = (state.data.realisasi || []).filter(r => r.rekeningId === item.id);

            let realisasi = 0;
            let pajak = 0;
            let monthly = Array(12).fill(0);
            let monthlyPajak = Array(12).fill(0);

            transactions.forEach(r => {
                const nilai = parseRupiah(r.nilai);
                const pajakTransaksi = parseRupiah(r.ppn || 0) + parseRupiah(r.pph || 0);
                realisasi += nilai;
                pajak += pajakTransaksi;
                if (r.tanggal) {
                    const dateParts = r.tanggal.split(/[-/.]/);
                    let month = -1;
                    if (dateParts.length === 3) {
                        if (parseInt(dateParts[0]) > 31) month = parseInt(dateParts[1]) - 1;
                        else if (parseInt(dateParts[2]) > 31) month = parseInt(dateParts[1]) - 1;
                        else month = parseInt(dateParts[1]) - 1;
                    }
                    if (month >= 0 && month <= 11) {
                        monthly[month] += nilai;
                        monthlyPajak[month] += pajakTransaksi;
                    }
                    else {
                        const fallbackMonth = new Date(r.tanggal).getMonth();
                        if (!isNaN(fallbackMonth)) {
                            monthly[fallbackMonth] += nilai;
                            monthlyPajak[fallbackMonth] += pajakTransaksi;
                        } else {
                            monthly[0] += nilai;
                            monthlyPajak[0] += pajakTransaksi;
                        }
                    }
                } else {
                    monthly[0] += nilai;
                    monthlyPajak[0] += pajakTransaksi;
                }
            });

            if (item.children && item.children.length > 0) {
                let sumMurni = 0, sumEfisiensi = 0, sumPerubahan = 0, sumReal = 0, sumPajak = 0, sumBelum = 0;
                let sumMonthly = Array(12).fill(0);
                let sumMonthlyPajak = Array(12).fill(0);
                item.children.forEach(child => {
                    const childData = getAggregatedData(child);
                    sumMurni += childData.paguMurni;
                    sumEfisiensi += childData.paguEfisiensi;
                    sumPerubahan += childData.paguPerubahan;
                    sumReal += childData.realisasi;
                    sumPajak += childData.pajak;
                    sumBelum += childData.belumSP2D;
                    childData.monthly.forEach((v, i) => sumMonthly[i] += v);
                    childData.monthlyPajak.forEach((v, i) => sumMonthlyPajak[i] += v);
                });
                paguMurni = sumMurni; paguEfisiensi = sumEfisiensi; paguPerubahan = sumPerubahan;
                realisasi = sumReal; pajak = sumPajak; belumSP2D = sumBelum; monthly = sumMonthly; monthlyPajak = sumMonthlyPajak;
            }
            return { paguMurni, paguEfisiensi, paguPerubahan, realisasi, pajak, belumSP2D, monthly, monthlyPajak };
        }

        function calculateFilteredTotals(items) {
            let murni = 0, efisiensi = 0, perubahan = 0, real = 0, pajak = 0, belum = 0;
            let monthly = Array(12).fill(0);
            let monthlyPajak = Array(12).fill(0);
            const walk = (list, forceMatch) => {
                list.forEach(item => {
                    const fh = state.sipd.filterHier;
                    let skip = false;
                    if (fh.program !== 'all' && item.type === 'program' && item.id !== fh.program) skip = true;
                    if (fh.kegiatan !== 'all' && item.type === 'kegiatan' && item.id !== fh.kegiatan) skip = true;
                    if (fh.sub_kegiatan !== 'all' && item.type === 'sub_kegiatan' && item.id !== fh.sub_kegiatan) skip = true;
                    if (fh.rekening !== 'all' && item.type === 'rekening' && item.id !== fh.rekening) skip = true;
                    if (skip) return;
                    const matchText = !state.sipd.filterSearch || item.uraian.toLowerCase().includes(state.sipd.filterSearch) || (item.kode || '').toLowerCase().includes(state.sipd.filterSearch);
                    const force = forceMatch || matchText;
                    if (item.type === 'rekening') {
                        const agg = getAggregatedData(item);
                        if (force && sipdHasFilledPagu(item)) {
                            murni += agg.paguMurni; efisiensi += agg.paguEfisiensi; perubahan += agg.paguPerubahan;
                            real += agg.realisasi; belum += agg.belumSP2D;
                            pajak += agg.pajak;
                            agg.monthly.forEach((v, i) => monthly[i] += v);
                            agg.monthlyPajak.forEach((v, i) => monthlyPajak[i] += v);
                        }
                    } else if (item.children) {
                        walk(item.children, force);
                    }
                });
            };
            walk(items, false);
            return { paguMurni: murni, paguEfisiensi: efisiensi, paguPerubahan: perubahan, realisasi: real, pajak, belumSP2D: belum, monthly, monthlyPajak };
        }

        // --- SIPD CORE FUNCTIONS ---
        function sipdBulanIdx(bln12) { return (Number(bln12) || 1) - 1; }

        function sipdEnsurePengajuanFields() {
            let changed = false;
            const walk = (items) => {
                if (!items) return;
                items.forEach(it => {
                    if (it.type === 'rekening') {
                        if (!it.pengajuanBulanan || !Array.isArray(it.pengajuanBulanan) || it.pengajuanBulanan.length !== 12) {
                            it.pengajuanBulanan = new Array(12).fill(0);
                            changed = true;
                        } else {
                            while (it.pengajuanBulanan.length < 12) { it.pengajuanBulanan.push(0); changed = true; }
                            if (it.pengajuanBulanan.length > 12) { it.pengajuanBulanan = it.pengajuanBulanan.slice(0, 12); changed = true; }
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return changed;
        }

        function sipdEnsureStatusFields() {
            let changed = false;
            const walk = (items) => {
                if (!items) return;
                items.forEach(it => {
                    if (it.type === 'rekening') {
                        if (!it.statusPengajuan || !Array.isArray(it.statusPengajuan) || it.statusPengajuan.length !== 12) {
                            it.statusPengajuan = new Array(12).fill('draft');
                            changed = true;
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return changed;
        }

        function sipdEnsureNomorFields() {
            let changed = false;
            const walk = (items) => {
                if (!items) return;
                items.forEach(it => {
                    if (it.type === 'sub_kegiatan') {
                        if (!it.nomorPengajuanBulanan || !Array.isArray(it.nomorPengajuanBulanan) || it.nomorPengajuanBulanan.length !== 12) {
                            it.nomorPengajuanBulanan = new Array(12).fill('');
                            changed = true;
                        }
                        if (!it.nomorSPPBulanan || !Array.isArray(it.nomorSPPBulanan) || it.nomorSPPBulanan.length !== 12) {
                            it.nomorSPPBulanan = new Array(12).fill('');
                            changed = true;
                        }
                        if (!it.nomorSP2DBulanan || !Array.isArray(it.nomorSP2DBulanan) || it.nomorSP2DBulanan.length !== 12) {
                            it.nomorSP2DBulanan = new Array(12).fill('');
                            changed = true;
                        }
                        if (!it.nomorSTS || !Array.isArray(it.nomorSTS) || it.nomorSTS.length !== 12) {
                            it.nomorSTS = new Array(12).fill('');
                            changed = true;
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return changed;
        }

        function sipdToggleNomorDropdown(itemId) {
            state.sipd.openNomorDropdowns = state.sipd.openNomorDropdowns || {};
            state.sipd.openNomorDropdowns[itemId] = !state.sipd.openNomorDropdowns[itemId];
            const drop = document.getElementById(`sipd-nomor-drop-${itemId}`);
            if (drop) {
                if (state.sipd.openNomorDropdowns[itemId]) {
                    drop.classList.remove('hidden');

                    const ta = drop.querySelector('textarea');
                    if (ta) {
                        ta.focus();
                        ta.select();
                    }
                } else {
                    drop.classList.add('hidden');
                    drop.classList.remove('block');
                }
            }
        }

        function sipdOnEditNomorSubKeg(itemId, bulanIdx, value) {
            const item = sipdFindItem(state.data.pagu, itemId);
            if (!item) return;

        }

        function sipdOnEditNomorSPPSubKeg(itemId, bulanIdx, value) {

        function sipdIsBulanLocked(rekeningItem, bulanIdx) {
            if (!rekeningItem || !rekeningItem.statusPengajuan) return false;
            const s = rekeningItem.statusPengajuan[bulanIdx];
            return s === 'diajukan' || s === 'diverifikasi';
        }

        function sipdGetTotalPengajuan(rekeningItem) {
            if (!rekeningItem || !rekeningItem.pengajuanBulanan) return 0;
            return rekeningItem.pengajuanBulanan.reduce((a, b) => a + (Number(b) || 0), 0);
        }

        function sipdGetActivePagu(agg) {
            if (state.viewMode === 'murni') return agg.paguMurni;
            if (state.viewMode === 'efisiensi') return agg.paguEfisiensi;
            if (state.viewMode === 'perbandingan') return agg.paguPerubahan;
            return agg.paguPerubahan;
        }

        function sipdGetActivePaguLabel() {
            if (state.viewMode === 'murni') return 'Pagu Murni';
            if (state.viewMode === 'efisiensi') return 'Pagu Efisiensi';
            if (state.viewMode === 'perbandingan') return 'Pagu Perubahan';
            return 'Pagu Perubahan';
        }

        function sipdGetActivePaguColor() {
            if (state.viewMode === 'murni') return 'bg-blue-950';
            if (state.viewMode === 'efisiensi') return 'bg-emerald-950';
            return 'bg-cyan-950';
        }

        function sipdHasFilledPagu(item) {
            if (item.type === 'rekening') {
                const agg = getAggregatedData(item);
                const paguAktif = sipdGetActivePagu(agg);
                return paguAktif > 0 || agg.realisasi > 0;
            }
            if (item.children && item.children.length > 0) {
                for (const c of item.children) if (sipdHasFilledPagu(c)) return true;
            }
            return false;
        }

        function sipdHasPengajuanInMonth(item, monthIdx) {
            if (item.type === 'rekening') {
                return (Number(item.pengajuanBulanan?.[monthIdx]) || 0) > 0;
            }
            if (item.children && item.children.length > 0) {
                for (const c of item.children) {
                    if (sipdHasPengajuanInMonth(c, monthIdx)) return true;
                }
            }
            return false;
        }

        function sipdHasAnyPengajuan(item) {
            if (item.type === 'rekening') {
                return (item.pengajuanBulanan || []).some(v => (Number(v) || 0) > 0);
            }
            if (item.children && item.children.length > 0) {
                for (const c of item.children) {
                    if (sipdHasAnyPengajuan(c)) return true;
                }
            }
            return false;
        }

            let icon = `<i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-slate-400 ml-1 inline-block flex-shrink-0" style="color:#94a3b8 !important;"></i>`;

            if (dir === 'asc') {
                icon = `<i data-lucide="arrow-up" class="w-3.5 h-3.5 text-cyan-400 font-black ml-1 inline-block flex-shrink-0" style="color:#22d3ee !important;"></i>`;
                activeCls = 'text-cyan-300 font-black ring-1 ring-cyan-400 bg-cyan-950 px-1 py-0.5 rounded';
            } else if (dir === 'desc') {
                icon = `<i data-lucide="arrow-down" class="w-3.5 h-3.5 text-amber-400 font-black ml-1 inline-block flex-shrink-0" style="color:#fbbf24 !important;"></i>`;
                activeCls = 'text-amber-300 font-black ring-1 ring-amber-400 bg-amber-950 px-1 py-0.5 rounded';
            }

            const safeLabel = (labelHtml && String(labelHtml).trim()) ? labelHtml : (fallbackText || 'Kolom');
            const labelMarkup = safeLabel.includes('<')
                ? `<div style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; color:#ffffff !important; font-weight:900;">${safeLabel}</div>`
                : `<span style="color:#ffffff !important; font-weight:900; line-height:1.2; display:block; text-align:right;">${safeLabel}</span>`;

            return `<button onclick="sipdToggleSort('${key}')" title="Klik untuk mengurutkan (Kecil->Besar, Besar->Kecil, Reset Normal)" class="w-full inline-flex items-center justify-end gap-1 hover:bg-white/10 px-1.5 py-1 rounded transition-all cursor-pointer select-none ${activeCls} ${extraCss}" style="color:#ffffff !important; background:transparent; font-weight:900;">
                ${labelMarkup}
                ${icon}
            </button>`;
        }

        function sipdHasMatchingChild(item) {
            if (!item.children || item.children.length === 0) return false;
            for (const c of item.children) {
                if (sipdItemVisible(c)) return true;
                if (c.children && sipdHasMatchingChild(c)) return true;
            }
            return false;
        }

        function sipdItemVisible(item) {
            const fh = state.sipd.filterHier;
            if (fh.program !== 'all' && item.type === 'program' && item.id !== fh.program) return false;
            if (fh.kegiatan !== 'all' && item.type === 'kegiatan' && item.id !== fh.kegiatan) return false;
            if (fh.sub_kegiatan !== 'all' && item.type === 'sub_kegiatan' && item.id !== fh.sub_kegiatan) return false;
            if (fh.rekening !== 'all' && item.type === 'rekening' && item.id !== fh.rekening) return false;
            if (!sipdHasFilledPagu(item)) return false;

            if (state.sipd.onlyFilledPengajuan) {
                const bln = state.sipd.bulanRedaksi;
                const idx = bln ? sipdBulanIdx(bln) : null;
                if (idx !== null) {
                    if (!sipdHasPengajuanInMonth(item, idx)) return false;
                } else {
                    if (!sipdHasAnyPengajuan(item)) return false;
                }
            }

            const search = state.sipd.filterSearch;
            const matchText = !search || item.uraian.toLowerCase().includes(search) || (item.kode || '').toLowerCase().includes(search);
            if (matchText) return true;
            if (item.type !== 'rekening') return sipdHasMatchingChild(item);
            return false;
        }

        function sipdFindItem(list, id) {
            for (const item of list) {
                if (item.id === id) return item;
                if (item.children) { const f = sipdFindItem(item.children, id); if (f) return f; }
            }
            return null;
        }

        function sipdInitHierOptions() {
            const progSelect = document.getElementById('sipd-program');
            const kegSelect = document.getElementById('sipd-kegiatan');
            const subkegSelect = document.getElementById('sipd-subkeg');
            const rekSelect = document.getElementById('sipd-rekening');

            const programs = state.data.pagu.filter(p => p.type === 'program' && sipdHasFilledPagu(p));
            progSelect.innerHTML = '<option value="all">SEMUA PROGRAM</option>' +
                programs.map(p => `<option value="${p.id}" ${state.sipd.filterHier.program === p.id ? 'selected' : ''}>${p.kode} - ${p.uraian}</option>`).join('');

            let kegiatanList = [];
            kegSelect.disabled = state.sipd.filterHier.program === 'all';
            if (state.sipd.filterHier.program !== 'all') {
                const sp = programs.find(p => p.id === state.sipd.filterHier.program);
                if (sp && sp.children) kegiatanList = sp.children.filter(c => c.type === 'kegiatan' && sipdHasFilledPagu(c));
            }
            kegSelect.innerHTML = '<option value="all">SEMUA KEGIATAN</option>' +
                kegiatanList.map(k => `<option value="${k.id}" ${state.sipd.filterHier.kegiatan === k.id ? 'selected' : ''}>${k.kode} - ${k.uraian}</option>`).join('');

            let subkegList = [];
            subkegSelect.disabled = state.sipd.filterHier.kegiatan === 'all';
            if (state.sipd.filterHier.kegiatan !== 'all') {
                const sk = sipdFindItem(state.data.pagu, state.sipd.filterHier.kegiatan);
                if (sk && sk.children) subkegList = sk.children.filter(s => s.type === 'sub_kegiatan' && sipdHasFilledPagu(s));
            }
            subkegSelect.innerHTML = '<option value="all">SEMUA SUB-KEGIATAN</option>' +
                subkegList.map(s => `<option value="${s.id}" ${state.sipd.filterHier.sub_kegiatan === s.id ? 'selected' : ''}>${s.kode} - ${s.uraian}</option>`).join('');

            let rekList = [];
            rekSelect.disabled = state.sipd.filterHier.sub_kegiatan === 'all';
            if (state.sipd.filterHier.sub_kegiatan !== 'all') {
                const sr = sipdFindItem(state.data.pagu, state.sipd.filterHier.sub_kegiatan);
                if (sr && sr.children) rekList = sr.children.filter(r => r.type === 'rekening' && sipdHasFilledPagu(r));
            }
            rekSelect.innerHTML = '<option value="all">SEMUA REKENING</option>' +
                rekList.map(r => `<option value="${r.id}" ${state.sipd.filterHier.rekening === r.id ? 'selected' : ''}>${r.kode} - ${r.uraian}</option>`).join('');
        }

        function sipdDebounceRender() {
            if (state.sipd._debounceTimer) clearTimeout(state.sipd._debounceTimer);
            state.sipd._debounceTimer = setTimeout(() => {
                state.sipd.filterSearch = document.getElementById('sipd-search').value.toLowerCase();
                sipdCheckResetBtn();
                renderSIPD();
            }, 200);
        }

        function sipdIsFiltering() {
            const s = state.sipd;
            const hasSearch = !!s.filterSearch;
            const hasHier = s.filterHier.program !== 'all' || s.filterHier.kegiatan !== 'all'
                || s.filterHier.sub_kegiatan !== 'all' || s.filterHier.rekening !== 'all';
            return hasSearch || hasHier;
        }

        function sipdCheckResetBtn() {
            const btn = document.getElementById('sipd-reset-btn');
            if (btn) {
                if (sipdIsFiltering()) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            }
        }

        function sipdResetFilter() {
            const searchEl = document.getElementById('sipd-search');
            if (searchEl) searchEl.value = '';
            state.sipd.filterSearch = '';
            state.sipd.filterHier = { program: 'all', kegiatan: 'all', sub_kegiatan: 'all', rekening: 'all' };
            state.sipd.expanded = {};
            state.sipd.allExpanded = false;
            sipdInitHierOptions();
            sipdCheckResetBtn();
            sipdUpdateDetailBtnUI();
            renderSIPD();
        }

        function sipdOnHierChange(level) {
            const elId = level === 'sub_kegiatan' ? 'sipd-subkeg' : `sipd-${level}`;
            const el = document.getElementById(elId);
            const val = el ? el.value : 'all';
            state.sipd.filterHier[level] = val;
            if (level === 'program') { state.sipd.filterHier.kegiatan = 'all'; state.sipd.filterHier.sub_kegiatan = 'all'; state.sipd.filterHier.rekening = 'all'; }
            else if (level === 'kegiatan') { state.sipd.filterHier.sub_kegiatan = 'all'; state.sipd.filterHier.rekening = 'all'; }
            else if (level === 'sub_kegiatan') { state.sipd.filterHier.rekening = 'all'; }
            sipdInitHierOptions();
            sipdCheckResetBtn();
            renderSIPD();
        }

        function sipdToggleExpand(id) {
            state.sipd.expanded[id] = !state.sipd.expanded[id];
            renderSIPD();
        }

        function sipdToggleExpandAll() {
            state.sipd.allExpanded = !state.sipd.allExpanded;
            if (state.sipd.allExpanded) {
                const walk = (items) => { items.forEach(it => { if (it.type !== 'rekening') state.sipd.expanded[it.id] = true; if (it.children) walk(it.children); }); };
                walk(state.data.pagu);
            } else {
                state.sipd.expanded = {};
            }
            sipdUpdateDetailBtnUI();
            renderSIPD();
        }

        function sipdUpdateDetailBtnUI() {
            const btn = document.getElementById('sipd-btn-detail-toggle');
            if (!btn) return;
            btn.className = "bg-amber-500 text-white px-3 py-1.5 rounded-lg font-black uppercase text-[8px] flex items-center gap-1.5 hover:bg-amber-600 transition-all shadow-sm";
            if (state.sipd.allExpanded) {

        function sipdEnsureVisibleColumns() {
            if (!state.sipd.visibleColumns || typeof state.sipd.visibleColumns !== 'object') {
                state.sipd.visibleColumns = { ...DEFAULT_VISIBLE_COLUMNS };
            } else {
                const normalized = sipdNormalizeVisibleColumns(state.sipd.visibleColumns);
                if (JSON.stringify(normalized) !== JSON.stringify(state.sipd.visibleColumns)) {
                    state.sipd.visibleColumns = normalized;
                    localStorage.setItem(`${appId}_visibleColumns`, JSON.stringify(normalized));
                }
            }
        }

        function sipdIsColVisible(key) {
            if (!state.sipd.visibleColumns) return true;
            return state.sipd.visibleColumns[key] !== false;
        }

        function sipdToggleColDropdown() {
            const dd = document.getElementById('sipd-col-dropdown');
            if (!dd) return;
            const isHidden = dd.classList.contains('hidden');
            if (isHidden) {
                sipdRenderColCheckboxes();
                dd.classList.remove('hidden');
            } else {
                dd.classList.add('hidden');
            }
        }

        function sipdRenderColCheckboxes() {
            const container = document.getElementById('sipd-col-checkbox-container');
            if (!container) return;

                const checked = sipdIsColVisible(col.key) ? 'checked' : '';

            if (!state.sipd.visibleColumns) state.sipd.visibleColumns = {};
            COLUMN_DEFS.forEach(col => {

        function sipdSimpanBulan(bulanIdx) {
            saveToSupabase({
                pagu: state.data.pagu,
                realisasi: state.data.realisasi,
                backups: state.data.backups,
                redaksi: state.sipd.redaksi
            }).then(() => {
                showNotif(`✅ Data bulan ${BULAN_LIST_FULL[bulanIdx]} berhasil disimpan!`, "success");
            }).catch(err => {
                showNotif("Gagal menyimpan: " + (err.message || ""), "error");
            });
        }

        function sipdAjukanBulan(bulanIdx) {
            let count = 0;
            let realisasiMelebihi = 0;
            const walk = (items) => {
                items.forEach(it => {
                    if (it.type === 'rekening') {
                        const nom = Number(it.pengajuanBulanan?.[bulanIdx]) || 0;
                        if (nom > 0 && it.statusPengajuan[bulanIdx] === 'draft') {
                            const agg = getAggregatedData(it);
                            const totalPengajuan = sipdGetTotalPengajuan(it);
                            if (totalPengajuan > agg.realisasi + 0.5) {
                                it.pengajuanBulanan[bulanIdx] = 0; // Dikosongkan kembali
                                realisasiMelebihi++;
                            } else {
                                it.statusPengajuan[bulanIdx] = 'diajukan';
                                count++;
                            }
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            if (count === 0 && realisasiMelebihi === 0) {
                showNotif(`Tidak ada rekening yang diisi untuk bulan ${BULAN_LIST[bulanIdx]} (semua 0 / sudah diajukan)`, "info");
                return;
            }
            sipdSaveDebounce();
            renderSIPD();
            if (count > 0) {
                showNotif(`✅ Bulan ${BULAN_LIST_FULL[bulanIdx]}: ${count} Rekening berhasil diajukan & dikunci.`, "success");
            }
            if (realisasiMelebihi > 0) {
                setTimeout(() => showNotif(`⚠ ${realisasiMelebihi} rekening memiliki total pengajuan Januari–Desember melebihi Realisasi APBD — input bulan ini dikosongkan dan tidak diajukan.`, "error"), 400);
            }
        }

        function sipdIsMonthLocked(bulanIdx) {
            let locked = false;
            const walk = (items) => {
                items.forEach(it => {
                    if (it.type === 'rekening' && it.statusPengajuan) {
                        const s = it.statusPengajuan[bulanIdx];
                        if (s === 'diajukan' || s === 'diverifikasi') locked = true;
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return locked;
        }

        function sipdBukaKunciBulan(bulanIdx) {
            let count = 0;
            const walk = (items) => {
                items.forEach(it => {
                    if (it.type === 'rekening' && it.statusPengajuan) {
                        if (it.statusPengajuan[bulanIdx] === 'diajukan' || it.statusPengajuan[bulanIdx] === 'diverifikasi') {
                            it.statusPengajuan[bulanIdx] = 'draft';
                            count++;
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            sipdSaveDebounce();
            renderSIPD();
            if (count > 0) {
                showNotif(`🔓 Bulan ${BULAN_LIST_FULL[bulanIdx]}: ${count} Rekening berhasil dibuka kuncinya.`, "success");
            } else {
                showNotif(`Bulan ${BULAN_LIST_FULL[bulanIdx]} tidak dalam keadaan terkunci.`, "info");
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('sipd-col-toggle-wrapper');
            const dd = document.getElementById('sipd-col-dropdown');
            if (wrapper && dd && !wrapper.contains(e.target) && !dd.classList.contains('hidden')) {
                dd.classList.add('hidden');
            }
        });

        function sipdCountFilledSubKegForMonth(idx) {
            let count = 0;
            const walk = (items) => {
                items.forEach(it => {
                    if (!sipdItemVisible(it)) return;
                    if (it.type === 'sub_kegiatan') {
                        let subMonthSum = 0;
                        const sumKids = (kids) => {
                            if (!kids) return;
                            kids.forEach(k => {
                                if (k.type === 'rekening' && sipdItemVisible(k)) {
                                    subMonthSum += (Number(k.pengajuanBulanan?.[idx]) || 0);
                                }
                                if (k.children) sumKids(k.children);
                            });
                        };
                        sumKids(it.children);
                        if (subMonthSum > 0) count++;
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return count;
        }

        function sipdToTitleCase(str) {
            if (!str) return '';
            const smallWords = /^(dan|di|dalam|ke|dari|pada|untuk|yang|atau|terhadap|serta|dengan)$/i;
            return str.toLowerCase().split(' ').map((word, index) => {
                if (!word) return '';
                return word.split('/').map((subWord, subIndex) => {
                    return subWord.split('-').map((part, partIndex) => {
                        if (!part) return '';
                        if (index > 0 && subIndex === 0 && partIndex === 0 && smallWords.test(part)) {
                            return part.toLowerCase();
                        }
                        return part.charAt(0).toUpperCase() + part.slice(1);
                    }).join('-');
                }).join('/');
            }).join(' ');
        }

        function sipdResolveResosSuffix(item, parentProgram = null, currentKegiatan = null) {
            if (!item || item.type !== 'sub_kegiatan') return '';

            const contextText = [item.uraian || '', parentProgram?.uraian || '', currentKegiatan?.uraian || '']
                .join(' ')
                .toLowerCase();

            const isPenunjang = contextText.includes('penunjang');
            const isRehabilitasiSosial = contextText.includes('rehabilitasi sosial') || contextText.includes('resos');
            if (isPenunjang || !isRehabilitasiSosial) return '';

            const normalized = contextText
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            if (
                normalized.includes('lanjut usia') ||
                normalized.includes('lansia')
            ) {
                return ' (RESOS LANSIA)';
            }
            if (
                normalized.includes('pmks') && (
                    normalized.includes('di dalam panti') ||
                    normalized.includes('luar hiv') ||
                    normalized.includes('lainnya')
                )
            ) {
                return ' (RESOS PMKS)';
            }
            if (
                normalized.includes('anak')
            ) {
                return ' (RESOS ANAK)';
            }
            if (
                normalized.includes('disabilitas') ||
                normalized.includes('penyandang disabilitas')
            ) {
                return ' (RESOS DISABILITAS)';
            }

            return '';
        }

        function sipdFormatRedaksiPengajuanSubKeg(item, parentProgram, currentKegiatan = null) {

            let cleanKodePanti = (rawKodePanti && rawKodePanti.trim()) ? rawKodePanti.trim().toUpperCase() : 'PPS012';
            cleanKodePanti = cleanKodePanti.replace(/^TU-?/i, '').replace(/-+$/, '').trim();
            if (!cleanKodePanti) cleanKodePanti = 'PPS012';

            // Pelaksana

            let pelaksanaCode = (pelaksana || 'TU').toUpperCase();
            if (pelaksanaCode === 'TATA USAHA' || pelaksanaCode === 'LAINNYA') pelaksanaCode = 'TU';

            return `(${pelaksanaCode}-${cleanKodePanti}-${kodeBulan}) Pengajuan ${pelaksanaCode} ${namaUnit} bulan ${namaBulan} ${tahun} Sub Kegiatan ${subKegTitleCase}${resosSuffix}`;

        function sipdGetItemSortValue(it, key, targetIdx) {
            if (!it) return 0;
            const agg = getAggregatedData(it);

            if (key === 'pagu') return Number(sipdGetActivePagu(agg)) || 0;
            if (key === 'realisasi') return Number(agg.realisasi) || 0;
            if (key === 'pajak') return Number(agg.pajak) || 0;
            if (key === 'sisa') return Number(sipdGetActivePagu(agg) - agg.realisasi) || 0;

            const curIdx = (targetIdx !== null && targetIdx !== undefined) ? targetIdx : 0;

            if (key.startsWith('month_')) {
                const mIdx = parseInt(key.split('_')[1]);
                const idxToUse = isNaN(mIdx) ? curIdx : mIdx;
                if (it.type === 'rekening') return Number(it.pengajuanBulanan?.[idxToUse]) || 0;
                let sum = 0;
                const walkKids = (kids) => {
                    if (!kids) return;
                    kids.forEach(k => {
                        if (k.type === 'rekening') sum += (Number(k.pengajuanBulanan?.[idxToUse]) || 0);
                        if (k.children) walkKids(k.children);
                    });
                };
                walkKids(it.children);
                return Number(sum) || 0;
            }

            if (key === 'realisasi_bulanan') return Number(agg.monthly?.[curIdx]) || 0;
            if (key === 'pajak_bulanan') return Number(agg.monthlyPajak?.[curIdx]) || 0;

            if (key === 'sisa_saldo') {
                let peng = 0;
                if (it.type === 'rekening') peng = Number(it.pengajuanBulanan?.[curIdx]) || 0;
                else {
                    const walkKids = (kids) => {
                        if (!kids) return;
                        kids.forEach(k => {
                            if (k.type === 'rekening') peng += (Number(k.pengajuanBulanan?.[curIdx]) || 0);
                            if (k.children) walkKids(k.children);
                        });
                    };
                    walkKids(it.children);
                }
                const realBln = Number(agg.monthly?.[curIdx]) || 0;
                return (Number(peng) || 0) - realBln;
            }
            return 0;
        }

        function sipdRenderRows(items, depth, bodyEl, parentProgram = null, parentKegiatan = null) {
            const borderColor = 'border-slate-300';
            const blnRedaksi = state.sipd.bulanRedaksi;
            const targetIdx = blnRedaksi ? sipdBulanIdx(blnRedaksi) : null;
            const isOnlySubKeg = state.sipd.onlyFilledPengajuan;
            const isSortingActive = state.sipd.sortDir !== 'none' && !!state.sipd.sortKey;

            // Jika sorting aktif ATAU dalam mode "Sub-Kegiatan Diajukan" (isOnlySubKeg) pada top-level (depth === 0),
            // ratakan seluruh Sub-Kegiatan secara global agar pengurutan numerik tabel benar dari atas ke bawah.
            if ((isOnlySubKeg || isSortingActive) && depth === 0) {
                let flatList = [];
                const collectSubKeg = (list, pProg = null, pKeg = null) => {
                    list.forEach(item => {
                        let curProg = pProg;
                        let curKeg = pKeg;
                        if (item.type === 'program') curProg = item;
                        if (item.type === 'kegiatan') curKeg = item;
                        if (item.type === 'sub_kegiatan') {
                            if (sipdItemVisible(item)) {
                                flatList.push({ item, currentProgram: curProg, currentKegiatan: curKeg });
                            }
                        } else if (item.children && item.children.length > 0) {
                            collectSubKeg(item.children, curProg, curKeg);
                        }
                    });
                };
                collectSubKeg(items, parentProgram, parentKegiatan);

                // Urutkan flatList secara global berdasarkan kolom yang dipilih
                if (isSortingActive) {
                    const key = state.sipd.sortKey;
                    const dir = state.sipd.sortDir === 'asc' ? 1 : -1;
                    flatList.sort((a, b) => {
                        const valA = sipdGetItemSortValue(a.item, key, targetIdx);
                        const valB = sipdGetItemSortValue(b.item, key, targetIdx);
                        if (valA !== valB) return (valA - valB) * dir;
                        return (a.item.kode || '').localeCompare(b.item.kode || '') * dir;
                    });
                }

                // Render setiap Sub-Kegiatan yang terurut secara global
                flatList.forEach(({ item, currentProgram, currentKegiatan }) => {
                    sipdRenderSingleRowItem(item, 0, bodyEl, currentProgram, currentKegiatan, targetIdx, borderColor, isOnlySubKeg || isSortingActive);
                });
                return;
            }

            // Hirarki Normal (tanpa sorting aktif)
            let renderList = [...items];
            renderList.forEach(item => {
                let currentProgram = parentProgram;
                let currentKegiatan = parentKegiatan;
                if (item.type === 'program') currentProgram = item;
                if (item.type === 'kegiatan') currentKegiatan = item;

                if (!sipdItemVisible(item)) return;

                sipdRenderSingleRowItem(item, depth, bodyEl, currentProgram, currentKegiatan, targetIdx, borderColor, false);
            });
        }

        function sipdRenderSingleRowItem(item, depth, bodyEl, currentProgram, currentKegiatan, targetIdx, borderColor, isOnlySubKeg) {
            const isExpanded = !!state.sipd.expanded[item.id];
            const style = LEVEL_STYLES[item.type];
            const agg = getAggregatedData(item);
            const activePagu = sipdGetActivePagu(agg);
            const sisa = activePagu - agg.realisasi;
            const isLeaf = item.type === 'rekening';
            const hasChildren = !isLeaf && item.children && item.children.some(c => sipdItemVisible(c));
            const pctReal = activePagu > 0 ? (agg.realisasi / activePagu * 100).toFixed(1) : '0';

            const tr = document.createElement('tr');
            tr.dataset.sipdItemId = item.id;
            tr.className = `hover:brightness-95 transition-all text-slate-900 border-b ${borderColor} ${isLeaf || isOnlySubKeg ? '' : 'cursor-pointer'}`;
            if (!isLeaf && !isOnlySubKeg) {
                tr.onclick = (e) => {
                    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
                    sipdToggleExpand(item.id);
                };
            }
            const leftPad = isOnlySubKeg ? 8 : (depth * 16 + 4);

            let bulanCells = '';
            const parentMonthly = new Array(12).fill(0);
            const parentRealMonthly = new Array(12).fill(0);
            if (isLeaf) {
                BULAN_LIST.forEach((b, idx) => {
                    if (targetIdx !== null && idx !== targetIdx) return;
                    if (!sipdIsColVisible(b.toLowerCase())) return;
                    const val = item.pengajuanBulanan ? (item.pengajuanBulanan[idx] || 0) : 0;
                    const showVal = val > 0 ? formatRupiah(val) : '';
                    const isLocked = sipdIsBulanLocked(item, idx);
                    const bgSel = isLocked ? 'bg-emerald-50' : (val > 0 ? 'bg-blue-50/50 focus-within:bg-blue-100/50' : 'bg-white focus-within:bg-slate-50');
                    const textSel = isLocked ? 'text-emerald-800 font-black' : (val > 0 ? 'text-slate-950 font-black' : 'text-slate-400 placeholder-slate-300');
                    const lockIcon = isLocked ? `<div class="absolute right-0.5 top-0.5 pointer-events-none"><i data-lucide="lock" class="w-2 h-2 text-emerald-600 opacity-80"></i></div>` : '';
                    const readonlyAttr = isLocked ? 'readonly' : '';
                    const cursorCls = isLocked ? 'cursor-not-allowed' : 'cursor-text';
                    bulanCells += `
                        <td class="px-1 py-1 w-[95px] border-r border-b ${borderColor} ${bgSel} p-0 align-middle relative">
                            <input type="text" inputmode="numeric"
                                placeholder=""
                                class="w-full h-full bg-transparent outline-none font-mono text-[8px] font-black text-right px-1 py-1 ${textSel} ${cursorCls}"
                                data-sipd-input="${item.id}-${idx}"
                                value="${showVal}"
                                ${readonlyAttr}
                                ${!isLocked ? 'onfocus="this.select()"' : ''}
                                ${!isLocked ? `onblur="sipdOnEditBulan('${item.id}', ${idx}, this.value)"` : ''}
                                ${!isLocked ? `onkeydown="if(event.key==='Enter'){event.preventDefault();sipdOnEditBulan('${item.id}', ${idx}, this.value);this.blur();}"` : ''}
                            />
                            ${lockIcon}
                        </td>`;
                });
            } else {
                const walk = (kids) => {
                    if (!kids) return;
                    kids.forEach(k => {
                        if (!sipdItemVisible(k)) return;
                        if (k.type === 'rekening') {
                            const arr = k.pengajuanBulanan;
                            if (arr && arr.length === 12) for (let i = 0; i < 12; i++) parentMonthly[i] += (Number(arr[i]) || 0);
                            const kAgg = getAggregatedData(k);
                            kAgg.monthly.forEach((v, i) => {
                                parentRealMonthly[i] += (Number(v) || 0);
                            });
                        }
                        if (k.children) walk(k.children);
                    });
                };
                walk(item.children);
                BULAN_LIST.forEach((b, idx) => {
                    if (targetIdx !== null && idx !== targetIdx) return;
                    if (!sipdIsColVisible(b.toLowerCase())) return;
                    const v = parentMonthly[idx];
                    bulanCells += `
                        <td data-sipd-parent-month="${item.id}-${idx}" class="px-1 py-1.5 w-[95px] border-r border-b ${borderColor} bg-white font-mono text-[8px] font-black text-right ${v > 0 ? 'text-slate-950' : 'text-slate-300'}">
                            ${v > 0 ? formatRupiah(v) : ''}
                        </td>`;
                });
            }

            let rowHtml = '';
            if (sipdIsColVisible('kode')) {
                rowHtml += `<td class="px-2 py-1.5 font-mono text-[9px] whitespace-nowrap align-middle border-r border-b ${borderColor} ${style.bg} text-slate-950 font-bold" style="padding-left: ${leftPad}px">
                    <div class="flex items-center gap-1">
                        ${(!isLeaf && !isOnlySubKeg) ? `<button onclick="sipdToggleExpand('${item.id}')" class="p-0.5 hover:bg-black/20 rounded flex-shrink-0"><i data-lucide="${isExpanded ? 'chevron-down' : 'chevron-right'}" class="w-3 h-3"></i></button>` : '<span class="w-3.5 h-3.5 flex-shrink-0"></span>'}
                        <span class="font-bold uppercase tracking-tight overflow-hidden text-ellipsis">${item.kode}</span>
                    </div>
                </td>`;
            }
            if (sipdIsColVisible('uraian')) {
                rowHtml += `<td class="px-3 py-1.5 border-r border-b ${borderColor} ${style.bg} text-slate-950">
                    <div class="flex flex-col">
                        <span class="uppercase text-[10px] font-black leading-tight tracking-tight">${item.uraian}</span>
                        <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                            <span class="text-[6px] font-black uppercase px-1.5 py-0.5 rounded bg-black/10 text-black shadow-sm">${style.label}</span>
                            ${isLeaf ? `<span class="text-[6px] font-mono font-bold text-black/80">(${pctReal}%)</span>` : ''}
                        </div>
                    </div>
                </td>`;
            }
            if (sipdIsColVisible('pagu')) {
                rowHtml += `<td class="px-2 py-1.5 border-r border-b ${borderColor} bg-white text-right font-mono text-[9px] font-black text-slate-950">
                    ${formatRupiah(activePagu)}
                </td>`;
            }
            if (sipdIsColVisible('realisasi')) {
                rowHtml += `<td class="px-2 py-1.5 border-r border-b ${borderColor} bg-white text-right font-mono text-[9px] font-black text-slate-950">
                    ${formatRupiah(agg.realisasi)}
                </td>`;
            }
            if (sipdIsColVisible('pajak')) {
                rowHtml += `<td class="px-2 py-1.5 border-r border-b ${borderColor} bg-white text-right font-mono text-[9px] font-black text-slate-950">
                    ${formatRupiah(agg.pajak)}
                </td>`;
            }
            if (sipdIsColVisible('sisa')) {
                rowHtml += `<td class="px-2 py-1.5 border-r border-b ${borderColor} bg-white text-right font-mono text-[9px] font-black ${sisa < 0 ? 'text-rose-600' : 'text-slate-950'}">
                    ${formatRupiah(sisa)}
                </td>`;
            }

            rowHtml += bulanCells;

            const bulanIdxAktif = targetIdx !== null ? targetIdx : 0;
            const realisasiBln = isLeaf ? (agg.monthly?.[bulanIdxAktif] || 0) : (parentRealMonthly[bulanIdxAktif] || 0);
            const pengajuanBln = isLeaf ? (item.pengajuanBulanan?.[bulanIdxAktif] || 0) : (parentMonthly[bulanIdxAktif] || 0);
            const sisaSaldo = pengajuanBln - realisasiBln;
            if (sipdIsColVisible('realisasi_bulanan')) {
                rowHtml += `<td class="px-2 py-1.5 border-r border-b ${borderColor} bg-white text-right font-mono text-[9px] font-black text-slate-950">
