        function sipdCollectMonthlyTotalsFromState() {
            const monthTotals = new Array(12).fill(0);
            const pajakTotals = new Array(12).fill(0);
            const pengajuanTotals = new Array(12).fill(0);
            let sumPengajuan = 0;
            const totalUnitType = state.sipd.onlyFilledPengajuan ? 'sub_kegiatan' : 'kegiatan';

            const walk = (items) => {
                items.forEach(it => {
                    if (it.type === totalUnitType) {
                        const agg = getAggregatedData(it);
                        for (let i = 0; i < 12; i++) {
                            monthTotals[i] += (Number(agg.monthly?.[i]) || 0);
                            pajakTotals[i] += (Number(agg.monthlyPajak?.[i]) || 0);
                            const sumPengajuanBulan = (children, monthIdx) => (children || []).reduce((sum, child) => {
                                return sum + (child.type === 'rekening' ? (Number(child.pengajuanBulanan?.[monthIdx]) || 0) : sumPengajuanBulan(child.children, monthIdx));
                            }, 0);
                            pengajuanTotals[i] += sumPengajuanBulan(it.children, i);
                        }
                        sumPengajuan += Array.from({ length: 12 }, (_, i) => {
                            const sumPengajuanBulan = (children, monthIdx) => (children || []).reduce((sum, child) => {
                                return sum + (child.type === 'rekening' ? (Number(child.pengajuanBulanan?.[monthIdx]) || 0) : sumPengajuanBulan(child.children, monthIdx));
                            }, 0);
                            return sumPengajuanBulan(it.children, i);
                        }).reduce((sum, value) => sum + value, 0);
                        return;
                    }
                    if (it.type === 'rekening') {
                        for (let i = 0; i < 12; i++) {
                            pengajuanTotals[i] += (Number(it.pengajuanBulanan?.[i]) || 0);
                        }
                        sumPengajuan += sipdGetTotalPengajuan(it);
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            return { monthTotals, pajakTotals, pengajuanTotals, sumPengajuan };
        }

            const { monthTotals, pajakTotals, pengajuanTotals } = sipdCollectMonthlyTotalsFromState();

            const targetIdx = blnRedaksi ? sipdBulanIdx(blnRedaksi) : null;

            let bulanTotals = '';

            if (sipdIsColVisible('pajak')) {

            }

            totalCells += bulanTotals;

            const activeMonthIdx = targetIdx !== null ? targetIdx : 0;
            const totalRealBln = monthTotals[activeMonthIdx] || 0;
            const totalPengajuanBln = pengajuanTotals[activeMonthIdx] || 0;
            const totalSisaSaldo = totalPengajuanBln - totalRealBln;
            if (sipdIsColVisible('realisasi_bulanan')) {
                totalCells += `<td id="sipd-total-realisasi-bulanan" class="px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-emerald-400" style="background-color:#0f172a !important; color:#34d399 !important;">${formatRupiah(totalRealBln)}</td>`;
            }
            if (sipdIsColVisible('pajak_bulanan')) {
                totalCells += `<td id="sipd-total-pajak-bulanan" class="px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-orange-400" style="background-color:#0f172a !important; color:#fb923c !important;">${formatRupiah(pajakTotals[activeMonthIdx] || 0)}</td>`;
            }
            if (sipdIsColVisible('sisa_saldo')) {
                const sisaBlnColorStyle = totalSisaSaldo < 0 ? 'color:#f87171 !important;' : 'color:#fde68a !important;';
                totalCells += `<td id="sipd-total-sisa-saldo" class="px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black ${totalSisaSaldo < 0 ? 'text-rose-400' : 'text-amber-200'}" style="background-color:#0f172a !important; ${sisaBlnColorStyle}">${formatRupiah(totalSisaSaldo)}</td>`;

            tr.style.backgroundColor = '#0f172a';
            tr.innerHTML = totalCells;

            const footEl = document.getElementById('sipd-table-foot');
            if (footEl) {
                footEl.innerHTML = '';
                footEl.appendChild(tr);
            } else if (targetEl) {

            }

            const globalSisa = document.getElementById('global-sisa');

        function sipdRefreshTotalRow() {
            const filtered = calculateFilteredTotals(state.data.pagu);
            const totalPagu = sipdGetActivePagu(filtered);
            const totalReal = filtered.realisasi;
            const totalSisa = totalPagu - totalReal;
            const { monthTotals, pajakTotals, pengajuanTotals } = sipdCollectMonthlyTotalsFromState();
            const blnRedaksi = state.sipd.bulanRedaksi;
            const targetIdx = blnRedaksi ? sipdBulanIdx(blnRedaksi) : null;

            const paguCell = document.getElementById('sipd-total-pagu');
            const realCell = document.getElementById('sipd-total-real');
            const sisaCell = document.getElementById('sipd-total-sisa');
            const realBlnCell = document.getElementById('sipd-total-realisasi-bulanan');
            const pajakCell = document.getElementById('sipd-total-pajak');
            const pajakBlnCell = document.getElementById('sipd-total-pajak-bulanan');
            const sisaSaldoCell = document.getElementById('sipd-total-sisa-saldo');
            if (paguCell) paguCell.innerText = formatRupiah(totalPagu);
            if (realCell) realCell.innerText = formatRupiah(totalReal);
            if (pajakCell) pajakCell.innerText = formatRupiah(filtered.pajak);
            if (sisaCell) {
                sisaCell.innerText = formatRupiah(totalSisa);
                if (totalSisa < 0) {
                    sisaCell.className = 'px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-rose-400';
                    sisaCell.style.color = '#f87171';
                } else {
                    sisaCell.className = 'px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-amber-300';
                    sisaCell.style.color = '#fcd34d';
                }
            }
            const activeMonthIdx = targetIdx !== null ? targetIdx : 0;
            const realBln = monthTotals[activeMonthIdx] || 0;
            const pengajuanBln = pengajuanTotals[activeMonthIdx] || 0;
            const sisaSaldo = pengajuanBln - realBln;
            if (realBlnCell) realBlnCell.innerText = formatRupiah(realBln);
            if (pajakBlnCell) pajakBlnCell.innerText = formatRupiah(pajakTotals[activeMonthIdx] || 0);
            if (sisaSaldoCell) {
                sisaSaldoCell.innerText = formatRupiah(sisaSaldo);
                if (sisaSaldo < 0) {
                    sisaSaldoCell.className = 'px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-rose-400';
                    sisaSaldoCell.style.color = '#f87171';
                } else {
                    sisaSaldoCell.className = 'px-2 py-2.5 border-r border-b border-slate-700 bg-slate-900 text-right font-mono text-[11px] font-black text-amber-200';
                    sisaSaldoCell.style.color = '#fde68a';
                }
            }
            for (let i = 0; i < 12; i++) {
                if (targetIdx !== null && i !== targetIdx) continue;
                const el = document.getElementById(`sipd-total-bulan-${i}`);
                const vPeng = pengajuanTotals[i] || 0;
                if (el) el.innerText = vPeng > 0 ? formatRupiah(vPeng) : '';

            const globalSisa = document.getElementById('global-sisa');
            if (globalSisa) globalSisa.innerText = formatRupiah(totalSisa);

            if (lbl) {
                const vm = state.viewMode;
                const text = vm === 'murni' ? 'Murni' : vm === 'efisiensi' ? 'Efisiensi' : vm === 'perbandingan' ? 'Perbandingan' : 'Perubahan';
                lbl.innerText = text;
            }
            if (iconEl) {
                const iconName = state.isModeLocked ? 'lock' : 'lock-open';
                iconEl.setAttribute('data-lucide', iconName);
            }
        }

        function renderSIPD() {
            sipdEnsureVisibleColumns();

            const migrasi1 = sipdEnsurePengajuanFields();
            const migrasi2 = sipdEnsureStatusFields();
            const migrasi3 = sipdEnsureNomorFields();
            if (migrasi1 || migrasi2 || migrasi3) sipdSaveDebounce();

            const progEl = document.getElementById('sipd-program');
            if (!progEl || !progEl.options || progEl.options.length <= 1) sipdInitHierOptions();
            sipdUpdateModeBadge();
            sipdCheckResetBtn();
            sipdRenderHead();
            const body = document.getElementById('sipd-table-body');
            const foot = document.getElementById('sipd-table-foot');
            if (!body) return;
            body.innerHTML = '';
            if (foot) foot.innerHTML = '';
            if (state.data.pagu.length === 0) {
                body.innerHTML = `<tr><td colspan="30" class="py-20 text-center opacity-20"><i data-lucide="clipboard-list" class="w-12 h-12 mx-auto mb-2"></i><span class="font-black uppercase tracking-[0.5em] text-[10px]">Database Kosong</span></td></tr>`;
            } else {
                sipdRenderRows(state.data.pagu, 0, body);
                sipdRenderTotalRow(foot || body);
            }
            sipdUpdatePengajuanBtnUI();
            sipdUpdateSortBtnUI();
            lucide.createIcons();
            console.log(`[SIPD] Render selesai • Mode Pagu: ${state.viewMode}${state.isModeLocked ? ' (DIKUNCI)' : ''}`);
        }

        function sipdRefreshParentMonthly(bulanIdx) {
            const walk = (item) => {
                if (!item) return 0;
                if (item.type === 'rekening') {
                    if (!sipdItemVisible(item)) return 0;
                    return Number(item.pengajuanBulanan?.[bulanIdx]) || 0;
                }
                let sum = 0;
                if (item.children) {
                    item.children.forEach(child => {
                        sum += walk(child);
                    });
                }
                const cell = document.querySelector(`[data-sipd-parent-month="${item.id}-${bulanIdx}"]`);
                if (cell) {
                    cell.innerText = sum > 0 ? formatRupiah(sum) : '';
                    const bulanKe = bulanIdx + 1;
                    const isJanAgu = bulanKe <= 8;
                    if (sum > 0) {
                        cell.className = `px-1 py-1.5 w-[95px] border-r border-b border-white/60 bg-inherit font-mono text-[8px] font-black text-right ${isJanAgu ? 'text-sky-200' : 'text-amber-100'}`;
                    } else {
                        cell.className = `px-1 py-1.5 w-[95px] border-r border-b border-white/60 bg-inherit font-mono text-[8px] font-black text-right opacity-30`;
                    }
                }
                return sum;
            };
            state.data.pagu.forEach(p => walk(p));
        }

        // --- EDIT HANDLER ---
        function sipdOnEditBulan(rekeningId, bulanIdx, rawValue) {
            const rek = sipdFindItem(state.data.pagu, rekeningId);
            if (!rek || !rek.pengajuanBulanan) return;
            if (sipdIsBulanLocked(rek, bulanIdx)) return;
            const num = parseRupiah(rawValue);
            rek.pengajuanBulanan[bulanIdx] = num;

            const agg = getAggregatedData(rek);
            const totalPengajuan = sipdGetTotalPengajuan(rek);

            if (totalPengajuan > agg.realisasi + 0.5) {
                rek.pengajuanBulanan[bulanIdx] = 0; // Dikosongkan kembali
                const inp = document.querySelector(`[data-sipd-input="${rekeningId}-${bulanIdx}"]`);
                if (inp) inp.value = '';
                showNotif(`⚠ Total Pengajuan Januari–Desember (${formatRupiah(totalPengajuan)}) melebihi Realisasi APBD (${formatRupiah(agg.realisasi)})! Input dikosongkan kembali.`, "error");
            } else {
                const inp = document.querySelector(`[data-sipd-input="${rekeningId}-${bulanIdx}"]`);
                if (inp && document.activeElement !== inp) {
                    inp.value = num > 0 ? formatRupiah(num) : '';
                }
            }

            sipdSaveDebounce();
            sipdRefreshParentMonthly(bulanIdx);
            sipdRefreshTotalRow();
        }

        // --- BULAN & AJUKAN ---
        function sipdOnBulanRedaksiChange(value) {
            state.sipd.bulanRedaksi = value === 'all' || !value ? null : Number(value);
            sipdUpdatePengajuanBtnUI();
            renderSIPD();
        }

        function sipdResetBulan() {
            state.sipd.bulanRedaksi = null;
            const sel = document.getElementById('sipd-bulan-redaksi');
            if (sel) sel.value = '9';
            sipdUpdatePengajuanBtnUI();
            renderSIPD();
        }

        function sipdSimpanDanAjukan() {
            const bln = state.sipd.bulanRedaksi;
            if (!bln) { showNotif("Pilih bulan terlebih dahulu di ComboBox Bulan", "warning"); return; }
            const idx = sipdBulanIdx(bln);
            let count = 0;
            let realisasiMelebihi = 0;
            const walk = (items) => {
                items.forEach(it => {
                    if (it.type === 'rekening') {
                        const nom = Number(it.pengajuanBulanan?.[idx]) || 0;
                        if (nom > 0 && it.statusPengajuan[idx] === 'draft') {
                            const agg = getAggregatedData(it);
                            const totalPengajuan = sipdGetTotalPengajuan(it);
                            if (totalPengajuan > agg.realisasi + 0.5) {
                                it.pengajuanBulanan[idx] = 0; // Dikosongkan kembali
                                realisasiMelebihi++;
                            } else {
                                it.statusPengajuan[idx] = 'diajukan';
                                count++;
                            }
                        }
                    }
                    if (it.children && Array.isArray(it.children)) walk(it.children);
                });
            };
            walk(state.data.pagu);
            if (count === 0 && realisasiMelebihi === 0) {
                showNotif(`Tidak ada rekening yang diisi untuk bulan ${BULAN_LIST[idx]} (semua 0 / sudah diajukan)`, "info");
                return;
            }
            sipdSaveDebounce();
            renderSIPD();
            if (count > 0) {
                showNotif(`✅ Bulan ${BULAN_LIST[idx]}: ${count} Rekening berhasil diajukan & dikunci (tidak bisa diedit).`, "success");
            }
            if (realisasiMelebihi > 0) {
                setTimeout(() => showNotif(`⚠ ${realisasiMelebihi} rekening memiliki total pengajuan Januari–Desember melebihi Realisasi APBD — input bulan ini dikosongkan dan tidak diajukan.`, "error"), 400);
            }
        }

        // --- REDAKSI DATA LIST ---
        function sipdGetOrInitRedaksi(bulan) {
            const key = String(bulan);
            if (!state.sipd.redaksi[key]) {
                state.sipd.redaksi[key] = { input_redaksi: '', realisasi_redaksi: '', sts_redaksi: '' };
            }
            return state.sipd.redaksi[key];
        }

        function sipdPreviewRedaksiList(bulan, includeCurrentFilters = false) {
            const idx = sipdBulanIdx(bulan);
            const rows = [];
            const subRedaksiById = new Map();
            const getSubMonthlyTotals = (subKegiatan) => {
                let pengajuan = 0;
                let realisasi = 0;
                const walk = (items) => {
                    if (!items) return;
                    items.forEach(item => {
                        if (includeCurrentFilters && !sipdItemVisible(item)) return;
                        if (item.type === 'rekening') {
                            pengajuan += Number(item.pengajuanBulanan?.[idx]) || 0;
                            realisasi += Number(getAggregatedData(item).monthly?.[idx]) || 0;
                        }
                        if (item.children) walk(item.children);
                    });
                };
                walk(subKegiatan.children);
                return { pengajuan, realisasi };
            };
            const pathWalker = (items, pathArr) => {
                items.forEach(it => {
                    const curPath = [...pathArr, it];
                    if (it.type === 'rekening') {
                        if (includeCurrentFilters) {
                            const matchesHierarchy = curPath.every(item => {
                                const selectedId = state.sipd.filterHier[item.type];
                                return !selectedId || selectedId === 'all' || item.id === selectedId;
                            });
                            if (!matchesHierarchy || !sipdItemVisible(it)) return;
                        }
                        const nom = Number(it.pengajuanBulanan?.[idx]) || 0;
                        if (nom > 0 || sipdHasFilledPagu(it)) {
                            const agg = getAggregatedData(it);
                            const pathProgram = curPath.find(p => p.type === 'program');
                            const pathKeg = curPath.find(p => p.type === 'kegiatan');
                            const pathSub = curPath.find(p => p.type === 'sub_kegiatan');
                            if (pathSub && !subRedaksiById.has(pathSub.id)) {
                                const subAgg = getAggregatedData(pathSub);
                                const subMonthlyTotals = getSubMonthlyTotals(pathSub);
                                const subPengajuan = subMonthlyTotals.pengajuan;
                                const subRealisasi = subMonthlyTotals.realisasi;
                                const tampilkanRedaksi = sipdGetActivePagu(subAgg) > 0 && subPengajuan > 0;
                                subRedaksiById.set(pathSub.id, {
                                    pengajuan: tampilkanRedaksi
                                        ? sipdFormatRedaksiPengajuanSubKeg(pathSub, pathProgram?.uraian, pathKeg?.uraian)
                                        : '',
                                    belanja: tampilkanRedaksi
                                        ? sipdFormatRedaksiBelanjaSubKeg(pathSub, pathProgram?.uraian, pathKeg?.uraian)
                                        : '',
                                    sts: tampilkanRedaksi
                                        ? sipdFormatRedaksiSTSSubKeg(pathSub, pathProgram?.uraian, pathKeg?.uraian, subPengajuan, subRealisasi, subPengajuan - subRealisasi)
                                        : ''
                                });
                            }
                            const subRedaksi = pathSub ? subRedaksiById.get(pathSub.id) : null;
                            rows.push({
                                subId: pathSub?.id || '',
                                subKode: pathSub?.kode || '',
                                kode: it.kode,
                                uraian: it.uraian,
                                program: pathProgram ? pathProgram.uraian : '',
                                kegiatan: pathKeg ? pathKeg.uraian : '',
                                sub_kegiatan: pathSub ? pathSub.uraian : '',
                                sumberDana: it.sumberDana || 'DAU',
                                pelaksana: it.pelaksana || 'TU',
                                redaksiPengajuan: subRedaksi?.pengajuan || '',
                                redaksiBelanja: subRedaksi?.belanja || '',
                                redaksiSTS: subRedaksi?.sts || '',
                                nomorPengajuan: pathSub?.nomorPengajuanBulanan?.[idx] || '',
                                pagu: sipdGetActivePagu(agg),
                                nominal: nom,
                                status: it.statusPengajuan?.[idx] || 'draft',
                                realisasi: agg.monthly?.[idx] || 0,
                                sisa: (sipdGetActivePagu(agg) - agg.realisasi)
                            });
                        }
                    }
                    if (it.children && Array.isArray(it.children)) pathWalker(it.children, curPath);
                });
            };
            pathWalker(state.data.pagu, []);
            return rows;
        }

        // --- MODAL REDAKSI GENERATOR ---
        function sipdGenerateDefaultInputRedaksi(bulan, rows) {
            const blnIdx = sipdBulanIdx(bulan);
            const bulanFull = BULAN_LIST_FULL[blnIdx];
            const thnIni = new Date().getFullYear();
            const totalNom = rows.reduce((a, r) => a + r.nominal, 0);
            const jumlahRek = rows.length;

            const groupByProgram = {};
            rows.forEach(r => {
                const key = r.program || 'TANPA PROGRAM';
                if (!groupByProgram[key]) groupByProgram[key] = { total: 0, items: [] };
                groupByProgram[key].total += r.nominal;
                groupByProgram[key].items.push(r);
            });

            let teks = `\tMenindaklanjuti Peraturan Daerah Kabupaten/Kota Nomor ... Tahun ${thnIni} tentang APBD Tahun Anggaran ${thnIni}, bersama ini kami sampaikan usulan pengajuan penarikan dana untuk pelaksanaan kegiatan pada bulan ${bulanFull} ${thnIni} dengan rincian sebagai berikut:\n\n`;
            teks += `\tDasar pelaksanaan adalah dokumen pelaksanaan anggaran yang telah ditetapkan. Usulan ini diajukan untuk memenuhi kebutuhan operasional dan pelayanan kepada masyarakat sesuai dengan program prioritas.\n\n`;
            teks += `\tRINCIAN PENGAJUAN BULAN ${bulanFull.toUpperCase()} ${thnIni}:\n\n`;

            let no = 1;
            Object.keys(groupByProgram).forEach((namaProg, iProg) => {
                const g = groupByProgram[namaProg];
                teks += `${no}. ${namaProg}\n`;
                teks += `   Jumlah Pengajuan: Rp ${formatRupiah(g.total)} (${terbilang(g.total).trim()} Rupiah)\n`;
                g.items.forEach((it, i) => {
                    teks += `   ${String.fromCharCode(97 + i)}. ${it.kegiatan}${it.sub_kegiatan ? ' — ' + it.sub_kegiatan : ''}\n`;
                    teks += `      Rekening: ${it.kode} - ${it.uraian}\n`;
                    teks += `      Sumber Dana: ${it.sumberDana}    |    Pelaksana: ${it.pelaksana}\n`;
                    teks += `      Pagu Aktif: Rp ${formatRupiah(it.pagu)}    |    Sisa: Rp ${formatRupiah(it.sisa)}\n`;
                    teks += `      Diajukan Bulan Ini: Rp ${formatRupiah(it.nominal)} (${terbilang(it.nominal).trim()} Rupiah)\n\n`;
                });
                no++;
            });

            teks += `\tTOTAL SELURUHNYA: Rp ${formatRupiah(totalNom)} (${terbilang(totalNom).trim()} Rupiah), terdiri dari ${jumlahRek} rekening belanja.\n\n`;
            teks += `\tDemikian usulan pengajuan ini disampaikan untuk dapat dipergunakan sebagaimana mestinya. Atas perhatian dan kerjasamanya, kami ucapkan terima kasih.\n\n`;
            return teks;
        }

        function sipdGenerateDefaultRealisasiRedaksi(bulan, rows) {
            const blnIdx = sipdBulanIdx(bulan);
            const bulanFull = BULAN_LIST_FULL[blnIdx];
            const thnIni = new Date().getFullYear();
            const rowsWithReal = rows.filter(r => r.realisasi > 0);
            const totalReal = rowsWithReal.reduce((a, r) => a + r.realisasi, 0);
            const totalPeng = rows.reduce((a, r) => a + r.nominal, 0);
            const pct = totalPeng > 0 ? ((totalReal / totalPeng) * 100).toFixed(2) : '0';

            let teks = `\tLAPORAN REALISASI BELANJA BULAN ${bulanFull.toUpperCase()} TAHUN ${thnIni}\n\n`;
            teks += `\tDengan penuh rasa tanggung jawab, kami sampaikan laporan realisasi belanja pada bulan ${bulanFull} ${thnIni} sesuai dengan pengajuan yang telah disetujui sebelumnya.\n\n`;
            teks += `\tRINGKASAN REALISASI:\n`;
            teks += `\t - Total Pengajuan Awal   : Rp ${formatRupiah(totalPeng)}\n`;
            teks += `\t - Total Realisasi        : Rp ${formatRupiah(totalReal)} (${terbilang(totalReal).trim()} Rupiah)\n`;
            teks += `\t - Persentase Penyerapan : ${pct}%\n\n`;

            if (rowsWithReal.length === 0) {
                teks += `\tCATATAN: Belum ada transaksi realisasi belanja yang dicatat untuk bulan ${bulanFull} ${thnIni}.\n\n`;
            } else {
                teks += `\tRINCIAN REALISASI PER REKENING:\n\n`;
                rowsWithReal.forEach((r, i) => {
                    const pctR = r.nominal > 0 ? ((r.realisasi / r.nominal) * 100).toFixed(1) : '0';
                    teks += `${i + 1}. ${r.program || ''}\n`;
                    teks += `   Kegiatan/Sub: ${r.kegiatan}${r.sub_kegiatan ? ' — ' + r.sub_kegiatan : ''}\n`;
                    teks += `   Rekening: ${r.kode} - ${r.uraian}\n`;
                    teks += `   Pengajuan  : Rp ${formatRupiah(r.nominal)}\n`;
                    teks += `   Realisasi  : Rp ${formatRupiah(r.realisasi)} (${terbilang(r.realisasi).trim()} Rupiah)\n`;
                    teks += `   Serapan    : ${pctR}%\n\n`;
                });
            }

            teks += `\tDemikian laporan realisasi ini disampaikan. Apabila terdapat kekurangan dan kelebihan kami mohon dimaklumi dan dapat dikomunikasikan kembali untuk perbaikan selanjutnya.\n\n`;
            return teks;
        }

        function sipdFormatRupiahSTS(value) {
            const v = Number(value || 0);
            return `Rp. ${formatRupiah(v)},-`;
        }

        function sipdGenerateDefaultSTSRedaksi(bulan, rows) {
            const blnIdx = sipdBulanIdx(bulan);
            const bulanFull = BULAN_LIST_FULL[blnIdx];
            const thnIni = new Date().getFullYear();
            const rowsDiajukan = rows.filter(r => Number(r.nominal || 0) > 0);
            const row = rowsDiajukan[0] || rows[0];
            const nominal = Number(row?.nominal || 0);
            const real = Number(row?.realisasi || 0);
            const sisa = nominal - real;

            const pantiEl = document.getElementById('sipd-kode-panti');
            const rawKodePanti = state.sipd.kodePanti || (pantiEl ? pantiEl.value : '');
            let cleanKodePanti = (rawKodePanti && rawKodePanti.trim()) ? rawKodePanti.trim().toUpperCase() : 'PPS012';
            cleanKodePanti = cleanKodePanti.replace(/^TU-?/i, '').replace(/-+$/, '').trim();
            if (!cleanKodePanti) cleanKodePanti = 'PPS012';

            const pelaksana = row?.pelaksana || 'TU';
            const pelaksanaCode = (pelaksana === 'TATA USAHA' || pelaksana === 'LAINNYA' || pelaksana === 'TU') ? 'TU' : String(pelaksana).toUpperCase();
            const subKeg = row?.sub_kegiatan || row?.uraian || 'Sub Kegiatan';

            return `(${pelaksanaCode}-${cleanKodePanti}-${String(blnIdx + 1).padStart(2, '0')}) Pengesahan SPJ ${pelaksanaCode} PPSDI RAHARJO SRAGEN bulan ${bulanFull} ${thnIni} Sub Kegiatan ${subKeg} Nilai TU isi ${sipdFormatRupiahSTS(nominal)} Nilai SPJ ${sipdFormatRupiahSTS(real)} Nilai Sisa ${sipdFormatRupiahSTS(sisa)}`;
        }

                                            </div>
                                            ${r.status === 'diajukan' || r.status === 'diverifikasi' ? `
                                                <div class="flex-shrink-0 bg-emerald-100 text-emerald-800 text-[6px] font-black uppercase px-1.5 py-0.5 rounded-full border border-emerald-200 flex items-center gap-0.5">
                                                    <i data-lucide="check-circle-2" class="w-2 h-2"></i> Diajukan
                                                </div>
                                            ` : `
                                                <div class="flex-shrink-0 bg-slate-100 text-slate-600 text-[6px] font-black uppercase px-1.5 py-0.5 rounded-full border border-slate-200">
                                                    Draft
                                                </div>
                                            `}
                                        </div>
                                        <div class="grid grid-cols-3 gap-1 mt-2 pt-2 border-t border-slate-100">
                                            <div>
                                                <div class="text-[5px] font-black uppercase text-slate-400 tracking-widest">Pagu</div>
                                                <div class="text-[8px] font-mono font-black text-slate-700">Rp ${formatRupiah(r.pagu)}</div>
                                            </div>
                                            <div>
                                                <div class="text-[5px] font-black uppercase text-emerald-600 tracking-widest">Realisasi</div>
                                                <div class="text-[8px] font-mono font-black text-emerald-800">Rp ${formatRupiah(r.realisasi)}</div>
                                            </div>
                                            <div>
                                                <div class="text-[5px] font-black uppercase text-amber-600 tracking-widest">Bulan Ini</div>
                                                <div class="text-[8px] font-mono font-black text-amber-800">Rp ${formatRupiah(r.nominal)}</div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Kanan: Editor Redaksi (col 3) -->
                        <div class="col-span-3 flex flex-col bg-white p-4 overflow-hidden">
                            <div class="flex items-center justify-between mb-3 flex-shrink-0">
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-slate-500">Editor Redaksi</h4>
                                <div class="flex gap-1.5">
                                    <button onclick="sipdRegenerateRedaksi('${jenis}', ${bulan})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md text-[7px] font-black uppercase transition-all flex items-center gap-1 border border-slate-200">
                                        <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> Buat Otomatis
                                    </button>
                                    <button onclick="sipdCopyRedaksi('${jenis}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md text-[7px] font-black uppercase transition-all flex items-center gap-1 border border-slate-200">
                                        <i data-lucide="copy" class="w-2.5 h-2.5"></i> Copy Teks
                                    </button>
                                    <button onclick="sipdCetakRedaksi('${jenis}', ${bulan})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md text-[7px] font-black uppercase transition-all flex items-center gap-1 border border-slate-200">
                                        <i data-lucide="printer" class="w-2.5 h-2.5"></i> Cetak
                                    </button>
                                </div>
                            </div>

                            <div class="flex-1 border-2 border-slate-200 rounded-xl bg-white shadow-inner overflow-hidden flex flex-col mb-3">
                                <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex items-center justify-between">
                                    <div class="text-[8px] font-black uppercase text-slate-600 tracking-widest">Kertas A4 • Margin 1 inci • Font Times New Roman 12pt</div>
                                    <div class="text-[8px] font-mono text-slate-400"><span id="sipd-redaksi-charcount">0</span> karakter</div>
                                </div>
                                <textarea id="sipd-redaksi-textarea" class="redaksi-text flex-1 w-full resize-none p-8"
                                    oninput="sipdUpdateCharCount()"
                                    placeholder="Tulis redaksi disini, atau klik tombol 'Buat Otomatis' di kanan atas...">${initial}</textarea>
                            </div>

                            <div class="flex justify-between items-center flex-shrink-0 gap-2">
                                <div class="text-[7px] font-bold text-slate-500 max-w-md leading-tight">
                                    <i data-lucide="info" class="w-3 h-3 inline text-slate-400 mr-1 align-middle"></i>
                                    Data redaksi disimpan otomatis ke database setiap kali Anda selesai mengetik.
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="sipdCloseRedaksiModal()" class="px-4 py-2 border-2 border-slate-200 rounded-xl text-[8px] font-black uppercase text-slate-500 hover:bg-slate-50 hover:text-slate-700 hover:border-slate-300 transition-all">
                                        Tutup
                                    </button>
                                    <button onclick="sipdSimpanRedaksi('${jenis}', ${bulan})" class="px-5 py-2 rounded-xl text-[8px] font-black uppercase text-white shadow-lg transition-all flex items-center gap-1.5 ${iconBg} hover:brightness-110">
                                        <i data-lucide="save" class="w-3 h-3"></i> Simpan & Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
            sipdUpdateCharCount();

            const ta = document.getElementById('sipd-redaksi-textarea');
            if (ta) {
                ta.addEventListener('input', () => {
                    const r = sipdGetOrInitRedaksi(bulan);
                    const field = jenis === 'input' ? 'input_redaksi' : jenis === 'realisasi' ? 'realisasi_redaksi' : 'sts_redaksi';
                    r[field] = ta.value;
                    state.data.redaksi = state.sipd.redaksi;
                    sipdSaveDebounce();
                });
            }
        }

        function sipdUpdateCharCount() {
            const ta = document.getElementById('sipd-redaksi-textarea');
            const cc = document.getElementById('sipd-redaksi-charcount');
            if (ta && cc) cc.innerText = formatRupiah(ta.value.length).replace(/\./g, ',');
        }

        function sipdGetTempRows() { return window._tmpRows || []; }

        function sipdRegenerateRedaksi(jenis, bulan) {
            const rows = window._tmpRows || sipdPreviewRedaksiList(bulan);
            let text = '';
            if (jenis === 'input') text = sipdGenerateDefaultInputRedaksi(bulan, rows);
            else if (jenis === 'realisasi') text = sipdGenerateDefaultRealisasiRedaksi(bulan, rows);
            else text = sipdGenerateDefaultSTSRedaksi(bulan, rows);
            const ta = document.getElementById('sipd-redaksi-textarea');
            if (ta) {
                ta.value = text;
                sipdUpdateCharCount();
                ta.dispatchEvent(new Event('input'));
            }
        }

        function sipdCopyRedaksi() {
            const ta = document.getElementById('sipd-redaksi-textarea');
            if (!ta) return;
            navigator.clipboard?.writeText(ta.value).then(() => showNotif("Teks redaksi disalin ke Clipboard", "success"));
        }

        function sipdCopyListRekening() {
            const rows = window._tmpRows || [];
            if (rows.length === 0) return;
            const text = rows.map((r, i) =>
                `${i + 1}. ${r.kode} | ${r.uraian} | Pagu: Rp ${formatRupiah(r.pagu)} | Pengajuan: Rp ${formatRupiah(r.nominal)} | Real: Rp ${formatRupiah(r.realisasi)}`
            ).join('\n');
            navigator.clipboard?.writeText(text).then(() => showNotif("Daftar rekening disalin ke Clipboard", "success"));
        }

        function sipdCetakRedaksi(jenis, bulan) {
            const ta = document.getElementById('sipd-redaksi-textarea');
            if (!ta) return;
            const blnIdx = sipdBulanIdx(bulan);
            const bulanFull = BULAN_LIST_FULL[blnIdx];
            const thnIni = new Date().getFullYear();
            const judul = jenis === 'input' ? 'REDAKSI PENGAJUAN' : jenis === 'realisasi' ? 'REDAKSI REALISASI' : 'SURAT TANGGUNG JAWAB';
            const w = window.open('', '_blank', 'width=900,height=900');
            if (!w) { showNotif("Browser memblokir popup. Izinkan popup untuk mencetak.", "warning"); return; }
            w.document.write(`
                <!DOCTYPE html><html><head><title>${judul} - ${bulanFull} ${thnIni}</title>
                <style>
                    body { font-family: 'Times New Roman', Times, serif; padding: 2.54cm; font-size: 12pt; line-height: 1.6; }
                    pre { white-space: pre-wrap; font-family: inherit; font-size: inherit; margin: 0; }
                </style></head><body><pre>${ta.value.replace(/</g, '&lt;')}</pre>
                <${''}script>window.onload=()=>{window.focus();setTimeout(()=>window.print(),400);};<${''}/${''}script>
</body></html>`);
            w.document.close();
        }

        function sipdSimpanRedaksi(jenis, bulan) {
            const ta = document.getElementById('sipd-redaksi-textarea');
            if (!ta) return;
            const r = sipdGetOrInitRedaksi(bulan);
            const field = jenis === 'input' ? 'input_redaksi' : jenis === 'realisasi' ? 'realisasi_redaksi' : 'sts_redaksi';
            r[field] = ta.value;
            state.data.redaksi = state.sipd.redaksi;
            saveToSupabase({
                pagu: state.data.pagu,
                realisasi: state.data.realisasi,
                backups: state.data.backups,
                redaksi: state.sipd.redaksi
            }).finally(() => {
                showNotif(`✅ Redaksi ${jenis === 'input' ? 'Pengajuan' : jenis === 'realisasi' ? 'Realisasi' : 'STS'} untuk ${BULAN_LIST_FULL[sipdBulanIdx(bulan)]} berhasil disimpan`, "success");
                setTimeout(sipdCloseRedaksiModal, 300);
            });
        }

        // --- WRAPPERS BUTTON ---
        function sipdBukaInputRedaksi() {
            const bln = state.sipd.bulanRedaksi;
            if (!bln) { showNotif("Pilih bulan terlebih dahulu", "warning"); return; }
            const r = sipdGetOrInitRedaksi(bln);
            const rows = sipdPreviewRedaksiList(bln);
            window._tmpRows = rows;
            const initial = r.input_redaksi || (rows.length > 0 ? sipdGenerateDefaultInputRedaksi(bln, rows) : '');
            sipdTampilkanModalRedaksi({
                jenis: 'input',
                title: 'Input Redaksi Pengajuan Bulanan',
                icon: 'pen-line',
                iconBg: 'bg-gradient-to-br from-blue-600 to-indigo-700',
                warnaAksen: 'border-blue-500',
                initial, rows, bulan: bln
            });
        }

        function sipdBukaRedaksiRealisasi() {
            const bln = state.sipd.bulanRedaksi;
            if (!bln) { showNotif("Pilih bulan terlebih dahulu", "warning"); return; }
            const r = sipdGetOrInitRedaksi(bln);
            const rows = sipdPreviewRedaksiList(bln);
            window._tmpRows = rows;
            const initial = r.realisasi_redaksi || (rows.length > 0 ? sipdGenerateDefaultRealisasiRedaksi(bln, rows) : '');
            sipdTampilkanModalRedaksi({
                jenis: 'realisasi',
                title: 'Redaksi Realisasi Belanja',
                icon: 'check-circle-2',
                iconBg: 'bg-gradient-to-br from-emerald-600 to-teal-700',
                warnaAksen: 'border-emerald-500',
                initial, rows, bulan: bln
            });
        }

        function sipdBukaRedaksiSTS() {
            const bln = state.sipd.bulanRedaksi;
            if (!bln) { showNotif("Pilih bulan terlebih dahulu", "warning"); return; }
            const r = sipdGetOrInitRedaksi(bln);
            const rows = sipdPreviewRedaksiList(bln);
            window._tmpRows = rows;
            const initial = r.sts_redaksi || (rows.length > 0 ? sipdGenerateDefaultSTSRedaksi(bln, rows) : '');
            sipdTampilkanModalRedaksi({
                jenis: 'sts',
                title: 'Redaksi Surat Tanggung Jawab (STS)',
                icon: 'stamp',
                iconBg: 'bg-gradient-to-br from-orange-600 to-red-700',
                warnaAksen: 'border-orange-500',
                initial, rows, bulan: bln
            });
        }

        // --- EXPORT ---
        function sipdExportExcel() {
            try {
                if (typeof XLSX === 'undefined') { showNotif("Library Excel belum siap, coba lagi dalam beberapa detik", "warning"); return; }
                const bln = state.sipd.bulanRedaksi;
                if (!bln) { showNotif("Pilih bulan terlebih dahulu untuk ekspor", "warning"); return; }
                const idx = sipdBulanIdx(bln);
                const previewRows = sipdPreviewRedaksiList(bln, true);
                const rows = state.sipd.onlyFilledPengajuan
                    ? Array.from(previewRows.reduce((grouped, row) => {
                        const key = row.subId || row.sub_kegiatan || row.kode;
                        let subRow = grouped.get(key);
                        if (!subRow) {
                            subRow = {
                                ...row,
                                kode: row.subKode || row.kode,
                                uraian: row.sub_kegiatan || row.uraian,
                                pagu: 0,
                                realisasi: 0,
                                sisa: 0,
                                nominal: 0
                            };
                            grouped.set(key, subRow);
                        }
                        subRow.pagu += Number(row.pagu) || 0;
                        subRow.realisasi += Number(row.realisasi) || 0;
                        subRow.sisa += Number(row.sisa) || 0;
                        subRow.nominal += Number(row.nominal) || 0;
                        return grouped;
                    }, new Map()).values())
                    : previewRows;
                const tableHeaders = Array.from(document.querySelectorAll('#sipd-table-head th'));
                const findRedaksiColumn = (label) => tableHeaders.findIndex(th => th.textContent.toLowerCase().includes(label));
                const redaksiColumnIndexes = {
                    pengajuan: findRedaksiColumn('redaksi pengajuan'),
                    belanja: findRedaksiColumn('redaksi belanja'),
                    sts: findRedaksiColumn('redaksi sts')
                };
                const redaksiTextBySubId = new Map();
                document.querySelectorAll('#sipd-table-body tr[data-sipd-item-id]').forEach(tr => {
                    const item = sipdFindItem(state.data.pagu, tr.dataset.sipdItemId);
                    if (!item || item.type !== 'sub_kegiatan') return;
                    const readRedaksiCell = (columnIndex) => columnIndex < 0
                        ? ''
                        : (tr.cells[columnIndex]?.querySelector('span')?.textContent.trim() || '');
                    redaksiTextBySubId.set(item.id, {
                        pengajuan: readRedaksiCell(redaksiColumnIndexes.pengajuan),
                        belanja: readRedaksiCell(redaksiColumnIndexes.belanja),
                        sts: readRedaksiCell(redaksiColumnIndexes.sts)
                    });
                });
                const data = [
                    ['NO', 'KODE REKENING', 'URAIAN REKENING', 'PROGRAM', 'KEGIATAN', 'SUB KEGIATAN', 'SUMBER DANA', 'PELAKSANA', 'PAGU AKTIF', 'REALISASI THN INI', 'SISA PAGU', 'PENGAJUAN BULAN INI', 'REDAKSI PENGAJUAN', 'NOMOR PENGAJUAN', 'REDAKSI BELANJA', 'REDAKSI STS', 'STATUS']
                ];
                rows.forEach((r, i) => {
                    const redaksi = redaksiTextBySubId.get(r.subId) || {};
                    data.push([i + 1, r.kode, r.uraian, r.program, r.kegiatan, r.sub_kegiatan, r.sumberDana, r.pelaksana, r.pagu, r.realisasi, r.sisa, r.nominal, redaksi.pengajuan || '', r.nomorPengajuan, redaksi.belanja || '', redaksi.sts || '', r.status.toUpperCase()]);
                });
                if (data.length === 1) { data.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', 'Tidak ada data']); }
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [{ wch: 5 }, { wch: 22 }, { wch: 45 }, { wch: 40 }, { wch: 40 }, { wch: 40 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 20 }, { wch: 70 }, { wch: 24 }, { wch: 70 }, { wch: 90 }, { wch: 12 }];
                ws['!rows'] = ws['!rows'] || [];
                data.slice(1).forEach((row, rowOffset) => {
                    const rowIndex = rowOffset + 1;
                    let maxLines = 1;
                    [12, 14, 15].forEach(colIndex => {
                        const cell = ws[XLSX.utils.encode_cell({ r: rowIndex, c: colIndex })];
                        if (!cell || cell.v === undefined || cell.v === null) return;
                        const columnWidth = ws['!cols'][colIndex].wch;
                        const lineCount = String(cell.v).split('\n').reduce((total, line) => {
                            return total + Math.max(1, Math.ceil(line.length / columnWidth));
                        }, 0);
                        maxLines = Math.max(maxLines, lineCount);
                        cell.s = { alignment: { wrapText: true, vertical: 'top' } };
                    });
                    if (maxLines > 1) ws['!rows'][rowIndex] = { hpt: Math.min(maxLines * 15, 300) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `SIPD_${BULAN_LIST[idx]}_${new Date().getFullYear()}`);
                const namaFile = `SIPD_Pengajuan_${BULAN_LIST_FULL[idx]}_${new Date().getFullYear()}.xlsx`;
                XLSX.writeFile(wb, namaFile);
                showNotif(`✅ Export Excel berhasil: ${namaFile}`, "success");
            } catch (e) {
                console.error(e);
                showNotif("Gagal export Excel: " + (e.message || ""), "error");
            }
        }

        // --- KODE PANTI HANDLER ---
        function sipdOnKodePantiChange() {
            const ta = document.getElementById('sipd-kode-panti');
            const val = ta ? ta.value : '';
            state.sipd.kodePanti = val;
            const chk = document.getElementById('sipd-simpan-tetap-panti');
            if (chk && chk.checked) {
                localStorage.setItem(`${appId}_kodePanti`, val);
            }
            sipdDebounceRender();
        }

        function sipdOnSimpanTetapChange() {
            const chk = document.getElementById('sipd-simpan-tetap-panti');
            const isChecked = chk ? chk.checked : false;
            localStorage.setItem(`${appId}_simpanTetapPanti`, isChecked ? 'true' : 'false');
            const ta = document.getElementById('sipd-kode-panti');
            const val = ta ? ta.value : '';
            if (isChecked) {
                localStorage.setItem(`${appId}_kodePanti`, val);
                showNotif("✅ Kode Panti disimpan tetap (persistent).", "success");
            } else {
                localStorage.removeItem(`${appId}_kodePanti`);
                showNotif("Kode Panti tidak lagi disimpan tetap.", "info");
            }
        }

        function sipdInitKodePanti() {
            const isTetap = localStorage.getItem(`${appId}_simpanTetapPanti`) === 'true';
            const savedKode = localStorage.getItem(`${appId}_kodePanti`) || '';
            const chk = document.getElementById('sipd-simpan-tetap-panti');
            const ta = document.getElementById('sipd-kode-panti');
            if (chk) chk.checked = isTetap;
            if (ta && isTetap) {
                ta.value = savedKode;
                state.sipd.kodePanti = savedKode;
            }
        }

        // --- START ---
        window.addEventListener('load', () => {
            sipdInitKodePanti();
            const now = new Date();
            const curBulan = String(now.getMonth() + 1);
            const sel = document.getElementById('sipd-bulan-redaksi');
            if (sel) sel.value = curBulan;
            state.sipd.bulanRedaksi = Number(curBulan);
            init();
        });
    </script>
    <script src="lock_data_guard.js"></script>
</body>

</html>
